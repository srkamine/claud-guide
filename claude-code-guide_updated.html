const PROD = new Set(["sdk","backend","prod","msgapi","subprocess"]);
let active = "setup";

// ── Helpers ───────────────────────────────────────────────────────────────────

function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;") }

function code(text){
  return `<div class="code-wrap">
    <pre>${esc(text)}</pre>
    <button class="copy-btn" onclick="copyCode(this)">Copy</button>
  </div>`;
}

function box(type, html){
  return `<div class="box box-${type}">${html}</div>`;
}

function card(icon, title, sub, color, html){
  const id = "c" + Math.random().toString(36).slice(2);
  return `<div class="card card-border" style="--c:${color}">
    <div class="card-header" onclick="toggleCard('${id}')">
      <span class="card-icon">${icon}</span>
      <div><div class="card-title">${title}</div>${sub?`<div class="card-sub">${sub}</div>`:""}
      </div><span class="card-arrow" id="arr-${id}">▼</span>
    </div>
    <div class="card-body" id="${id}">
      <div class="card-body-inner">${html}</div>
    </div>
  </div>`;
}

function h2(t){ return `<div class="h2">${t}</div>` }
function p(t){ return `<p class="p">${t}</p>` }
function pill(icon,label,desc){ return `<div class="grid-pill"><span class="grid-pill-icon">${icon}</span><div><div class="grid-pill-label">${label}</div><div class="grid-pill-desc">${desc}</div></div></div>` }

function copyCode(btn){
  const text = btn.previousElementSibling.textContent;
  navigator.clipboard.writeText(text).then(()=>{
    btn.textContent="✓"; btn.classList.add("ok");
    setTimeout(()=>{btn.textContent="Copy";btn.classList.remove("ok")},2000);
  });
}

function toggleCard(id){
  const body = document.getElementById(id);
  const arr  = document.getElementById("arr-"+id);
  const open = body.classList.toggle("open");
  arr.textContent = open ? "▲" : "▼";
}

// ── Section renderers ──────────────────────────────────────────────────────────

const CONTENT = {

setup: ()=> `
${p("Claude Code is a terminal AI agent. Install once, use in every project — or embed in your own app via the Agent SDK.")}
${h2("Installation")}
${code(`# Native binary (recommended)
curl -fsSL https://claude.ai/install.sh | bash

# macOS Homebrew
brew install --cask claude-code

# npm (legacy)
npm install -g @anthropic-ai/claude-code

claude --version
claude   # opens browser to authenticate on first run`)}
${h2("Key startup flags")}
${code(`claude                         # interactive session
claude 'fix bug in auth.ts'    # start with a prompt
claude -c                      # continue last session
claude -r 'session-name'       # resume named session
claude -p 'prompt'             # headless (non-interactive)
claude --model opus            # start with Opus
claude --permission-mode plan  # plan-only — no file writes
claude --permission-mode auto  # AI-classified auto-approve
claude --mcp-debug             # debug MCP connections
claude --safe-mode             # disable all customizations
claude -w feature-auth         # open in a git worktree
claude --bg -p 'long task'     # run in background`)}
${h2("First session checklist")}
${code(`cd your-project && claude

/init          # generate starter CLAUDE.md
/mcp           # set up external connections
/permissions   # configure approval rules
/memory        # review memory files

> "Explore the project and tell me what it does"`)}
`,

claudemd: ()=> `
${p("CLAUDE.md sits in your project root. Claude reads it at the start of every session — persistent memory about your stack, rules, and conventions. The single most impactful thing you can add to any project.")}
${box("info","<b>ℹ️</b> Without CLAUDE.md Claude starts each session knowing nothing. With it Claude already knows your stack, rules, and architecture before your first prompt.")}
${card("✨","Auto-generate with /init","Claude scans your project and writes CLAUDE.md automatically","#0f766e",
  code(`claude
/init     # Claude explores files, writes CLAUDE.md
/memory   # review and refine it`)
)}
${card("📋","Complete CLAUDE.md template","Copy → customize → commit to git","#0f766e",
  code(`# Project: E-commerce API

## What this is
Node.js + Express + PostgreSQL REST API for an online store.

## Tech stack
- Runtime: Node.js 20 + TypeScript
- Framework: Express 4
- Database: PostgreSQL 15 (DATABASE_URL in .env)
- Tests: Vitest + Supertest

## How to run
npm install && npm run dev   # dev server :3000
npm test                     # run all tests

## Structure
src/routes/     -> HTTP handlers (validate -> service -> respond)
src/services/   -> Business logic (no direct DB calls)
src/models/     -> All SQL queries (parameterized only)
tests/          -> mirrors src/

## Rules — always follow
- Every new endpoint needs a test in tests/routes/
- camelCase for JS vars, PascalCase for TS types
- Named exports only — no default exports
- All SQL in src/models/ — never inline SQL
- Response format: { data: ..., meta: { ... } }
- Never commit .env or API keys

## What NOT to do
- No ORM — raw SQL only
- No SELECT * in production
- Never push directly to main`)
)}
${card("🧪","Verify Claude reads your rules","Canary test — confirm rules are actually enforced","#0f766e",
  code(`# Add a canary rule to CLAUDE.md:
## Rules
- Add '# CLAUDE_OK' as first line of every new file.

# Ask Claude to create a file:
> "Create src/utils/date.ts with a formatDate() function"
# File should start with # CLAUDE_OK -> rules are working

# Test enforcement:
> "Use var for the loop counter"
# Claude should refuse or rewrite with let/const`)
)}
${card("🗂️","Nested CLAUDE.md for monorepos","Different rules per package — all load simultaneously","#0f766e",
  code(`# Root CLAUDE.md           -> project-wide rules
# packages/frontend/CLAUDE.md -> React-specific rules
# packages/api/CLAUDE.md      -> Node-specific rules

# All relevant files load simultaneously.
# More specific (deeper) files win on conflicts.

# The @filename path is RELATIVE to the CLAUDE.md file location.
# If packages/api/CLAUDE.md contains @docs/schema.md
# it resolves to packages/api/docs/schema.md`)
)}
${card("📎","Reference files with @filename","Keep CLAUDE.md short — link out to detail docs","#0f766e",
  code(`# In CLAUDE.md:
@docs/api-conventions.md
@docs/database-schema.md

# Path is relative to where CLAUDE.md lives — not the project root.
# Any path works: @conventions.md  @src/SCHEMA.md
# Claude loads these on demand when relevant.
# Keep CLAUDE.md under 200 lines (recommended max).`)
)}
`,

commands: ()=> `
${p("Type / in any session to see all commands with live filtering. Three input prefixes: <code>/command</code> for commands · <code>! shell command</code> to run inline · <code>#note</code> to add memory.")}
${code(`# Session & memory
  /init              Scan project, generate CLAUDE.md
  /memory            Edit memory files
  /compact           Summarize context to free space
  /compact [hint]    e.g. /compact focus on auth module
  /clear             Wipe conversation, start fresh
  /context           Show context window usage %
  /rewind            Roll back code + conversation
  /export            Export conversation to markdown

# Planning & review
  /plan              Toggle plan-only mode (no edits until approved)
  /ultraplan         Deeper planning — slower, more thorough
  /diff              Show all file changes this session
  /code-review       Review diff for bugs + cleanups
  /code-review --fix Same, auto-applies findings

# Navigation

  /branch            Fork session for safe experimentation

# Agents & tasks
  /tasks             List background subagent tasks
  /agents            View background agent sessions
  /goal <desc>       Set a goal Claude works toward
  /btw <question>    Side question — no context pollution
  /batch <instr>     Apply change across many files

# Models & cost
  /model opus        Switch to Opus (most capable)
  /model sonnet      Switch to Sonnet (best balance)
  /model haiku       Switch to Haiku (fastest, cheapest)
  /effort xhigh      Max reasoning — Opus only
  /cost              Show token usage and cost

# Keyboard shortcuts
  Shift+Tab x2       Toggle plan mode on/off
  Ctrl+C             Cancel current task
  Ctrl+B             Background current task
  ! command          Run shell inline: ! npm test
  # note             Add persistent memory note`)}
`,

tools: ()=> `
${p("Claude has 8 built-in tools. You never specify which tool to use — Claude picks automatically. Understanding each one helps you write better prompts and know what to expect.")}
${code(`Tool       What it acts on         The question it answers
────────────────────────────────────────────────────────────
Bash       Your OS shell           Anything you can type in terminal
Read       A specific file         What is inside this file?
Write      Creates a new file      How do I make this file from scratch?
Edit       An existing file        How do I change part of this file?
Glob/LS    FILE NAMES & paths      Which files exist matching this pattern?
Grep       FILE CONTENTS           Which files contain this text or pattern?
WebSearch  The internet            What is the current info on this?
Task       Spawns a subagent       How do I delegate without flooding context?`)}

${card("💻","Bash — run any shell command","Anything you type in terminal, Claude can run. Use ! for inline commands.","#059669",
  code(`# Claude runs these automatically:
> "Run the test suite and explain every failure"
> "Check if port 3000 is in use"
> "Run npm audit and fix fixable vulnerabilities"

# YOU run commands inline with ! — output enters conversation:
! git log --oneline -10    # Claude now knows git history
! npm test
! curl http://localhost:3000/health`)
)}
${card("📖","Read — load a file into context","Use @filename shorthand. Claude remembers the file for the whole session.","#059669",
  code(`# Reference with @ (most common):
> "Review @src/auth.ts and find the bug"

# Read multiple and compare:
> "Read @src/services/userService.ts and

)}

  code(`> "Create src/utils/date.ts with:

)}
${card("✂️","Edit — change part of an existing file","Surgical — only the target changes. Everything else stays intact.","#059669",

   Only that one value — nothing else."

${card("🔍","Grep — search inside files","Searches FILE CONTENTS — finds text or patterns inside files.","#059669",
  code(`# Examples:
> "Find every place that calls sendEmail().
   List file name and line number for each."
  # Grep searches for: sendEmail(

> "Search for TODO and FIXME comments.

> "Search all 300 files for deprecated API usage"

# With Task — only summary returns:
> "Use a subagent to search all files for deprecated
   API usage. Return only a list of file:line findings."

# Parallel subagents:
> "Run three subagents simultaneously:
   Agent 1: security vulnerabilities
   Agent 2: performance bottlenecks
   Agent 3: code quality issues

)}
${card("🗺️","Quick reference — which tool for which job","One-page lookup + how Claude combines tools automatically","#059669",

────────────────────────────────────────────────────────

Read and understand a specific file    -> Read (@filename)

Change part of an existing file        -> Edit
Find files by name or extension        -> Glob/LS

    </div>
  </div>`
)}

  code(`claude --permission-mode plan

> "Explore this codebase. Give me:

agents: ()=> `
${p("Almost everything in Claude Code is just a markdown file Claude reads and follows. Agents are markdown files. Skills are markdown files. CLAUDE.md is a markdown file. Understanding this makes the whole system click.")}
${h2("What everything actually is")}
${code(`.claude/
  agents/
    code-reviewer.md   <- specialist agent   (MARKDOWN)
    db-analyst.md      <- specialist agent   (MARKDOWN)
  skills/
    deploy.md          <- reusable workflow  (MARKDOWN)
    pr-summary.md      <- reusable workflow  (MARKDOWN)
  hooks/
    guard-bash.sh      <- lifecycle scripts  (SHELL — exception)
  settings.json        <- permissions config (JSON  — exception)
CLAUDE.md              <- project memory     (MARKDOWN)

# Hooks and settings.json are the only non-markdown pieces.`)}
${h2("Anatomy of an agent file — two parts")}
${code(`---
name: code-reviewer          # how Claude identifies this agent
description: Reviews code    # Claude reads this to decide WHEN
             for bugs and    # to auto-invoke — be specific here
             security issues
tools: Read, Grep, Glob      # tools this agent is ALLOWED to use
model: sonnet                # which Claude model runs it
memory: project              # remembers things across sessions
---

You are a senior code reviewer.
When reviewing code always check:
1. Security vulnerabilities first
2. Logic bugs and edge cases
3. Test coverage

Output format:
[CRITICAL] file:line — description
[HIGH]     file:line — description

# The YAML between --- is CONFIG (name, tools, model, memory).
# The markdown body is the SYSTEM PROMPT Claude follows.`)}
${h2("Every frontmatter field explained")}
${code(`name: code-reviewer
# Identifier. Used for explicit invocation:
# > "Use the code-reviewer agent to review src/auth.ts"

description: Reviews code for bugs, security, and conventions.
             Auto-invoke after non-trivial code changes.
# MOST IMPORTANT for auto-routing.
# Claude reads ALL descriptions at session start.
# When a task matches, Claude routes to that agent automatically.
# Include WHEN to use it in the description.

tools: Read, Grep, Glob
# Which built-in tools this agent can use.
# A reviewer with Read/Grep/Glob only CANNOT edit your files.
# Available: Read, Write, Edit, Bash, Glob, Grep, WebSearch, Task

model: sonnet
# Which Claude model runs this agent.
# opus   -> most capable, expensive (hard reasoning tasks)
# sonnet -> best balance (most tasks)
# haiku  -> fastest, cheapest (simple subtasks, save cost)

memory: project
# Whether agent remembers across sessions.
# project -> remembers within this project
# user    -> remembers across all your projects
# (omit)  -> fresh start every session`)}
${h2("How auto-invocation works")}
${code(`# At session start Claude reads ALL agent descriptions.
# It routes tasks automatically by matching context.

# You have these agents:
#   code-reviewer.md  "Reviews code for bugs and security..."
#   db-analyst.md     "Analyses PostgreSQL schemas and queries..."
#   test-writer.md    "Writes tests for new code..."

> "Review the changes I made to src/payments.ts"
# Claude sees: 'review' + 'changes' + '.ts file'
# -> routes to code-reviewer automatically

> "Our queries are slow — check the database"
# Claude sees: 'queries' + 'slow' + 'database'
# -> routes to db-analyst automatically

# You can also be explicit:
> "Use the code-reviewer agent to review src/auth.ts"

# Do you need to define agents upfront?
# No — Claude can do code review without any agent defined.
# Defining an agent gives you: consistent format, right tools,
# right model, accumulated memory across sessions.`)}
${h2("Where Claude looks for agents — priority order")}
${code(`1. Managed settings  (enterprise policy — highest priority)
2. --agents CLI flag (session-only override)
3. .claude/agents/   <- PROJECT agents (commit to git)
4. ~/.claude/agents/ <- PERSONAL agents (all projects)
5. Plugins           (installed plugin agents)`)}
${h2("settings.json — permissions and hooks config")}
${card("🔐","Permissions — allow and deny lists","Control which tool calls need your approval","#7c3aed",
  code(`{
  "permissions": {
    "allow": [
      "Read", "Glob", "Grep",
      "Bash(npm test)",
      "Bash(npm run lint)",
      "Bash(git diff *)",
      "Bash(git log *)",
      "Write(src/*)",
      "Edit(src/*)"
    ],
    "deny": [
      "Bash(rm *)",
      "Bash(git push *)",
      "Bash(git reset --hard *)",
      "Write(.env*)"
    ]
  }
}
# Anything not listed -> Claude asks you each time.
# deny always wins over allow if both match.`)
)}
${card("🗂️","Three settings files — which scope to use","Personal defaults, project team rules, local overrides","#7c3aed",
  code(`~/.claude/settings.json        # personal defaults
.claude/settings.json          # project (commit to git)
.claude/settings.local.json    # local overrides (gitignore this)

# .claude/settings.json (committed):
#   hooks, permissions, shared MCP servers — team-wide rules

# .claude/settings.local.json (gitignored):
#   your API tokens, local DB connection strings`)
)}
${card("📄","Complete settings.json example","A realistic team project config","#7c3aed",
  code(`{
  "permissions": {
    "allow": ["Read","Glob","Grep","Bash(npm test)","Bash(git diff *)"],
    "deny":  ["Bash(rm *)","Bash(git push *)","Write(.env*)"]
  },
  "hooks": {
    "PreToolUse": [{
      "matcher": "Bash",
      "hooks": [{"type":"command","command":".claude/hooks/guard.sh"}]
    }],
    "PostToolUse": [{
      "matcher": "Write|Edit",
      "hooks": [{"type":"command","command":".claude/hooks/lint.sh"}]
    }],
    "Stop": [{
      "hooks": [{"type":"command","command":".claude/hooks/test.sh"}]
    }]
  },
  "model": "claude-sonnet-4-6",
  "autoCompact": true
}`)
)}
${box("tip","<b>💡 Tip:</b> Don't write settings.json upfront. Start working, notice which operations make you nervous (git push, rm, writing to .env), then add deny rules for those. Build gradually from real experience.")}
`,

hooks: ()=> `
${p("Hooks fire automatically at lifecycle events — no Claude involvement, no judgement call. Unlike CLAUDE.md rules (Claude might forget) or skills (Claude decides), hooks enforce rules at the system level every single time.")}
${box("info","<b>ℹ️ Key distinction:</b> CLAUDE.md says 'please follow these rules'. Hooks enforce rules regardless of what Claude thinks. Use hooks for things that must happen 100% of the time.")}
${h2("Hook events")}
${code(`PreToolUse        -> before ANY tool call (main security gate)
PostToolUse       -> after a tool call completes
PreCompact        -> before /compact runs
Stop              -> when Claude finishes a turn
SessionStart      -> when a session begins (SDK only)
SessionEnd        -> when a session ends (SDK only)
CwdChanged        -> working directory changes
FileChanged       -> watched file modified externally
TaskCompleted     -> background task finishes

# Exit codes (CLI shell scripts):
exit 0  -> allow the tool call
exit 1  -> allow but surface a warning to Claude
exit 2  -> DENY the tool call`)}
${card("🛡️","Block dangerous commands (PreToolUse)",".claude/hooks/guard-bash.sh — fires before every Bash call","#dc2626",
  code(`#!/bin/bash
INPUT=$(cat)
CMD=$(echo "$INPUT" | python3 -c \\
  "import sys,json; print(json.load(sys.stdin).get('command',''))")

if echo "$CMD" | grep -qE 'rm -rf|DROP TABLE|truncate'; then
  echo "BLOCKED: Dangerous command: $CMD" >&2
  exit 2   # deny
fi
exit 0     # allow`)
)}
${card("✨","Auto-lint after every edit (PostToolUse)",".claude/hooks/auto-lint.sh — fires after Write or Edit","#dc2626",
  code(`#!/bin/bash
INPUT=$(cat)
FILE=$(echo "$INPUT" | python3 -c \\
  "import sys,json; print(json.load(sys.stdin).get('path',''))")

if echo "$FILE" | grep -qE '\\.(js|ts|jsx|tsx)$'; then
  npx prettier --write "$FILE" 2>/dev/null
  npx eslint --fix "$FILE" 2>/dev/null
fi`)
)}
${card("🐍","Hooks can call any language","Shell script is the wrapper — inside call Python, Node, Go, anything","#dc2626",
  code(`# .claude/hooks/guard-bash.sh
#!/bin/bash
cat | python3 .claude/hooks/guard.py

# .claude/hooks/guard.py
import sys, json
data = json.load(sys.stdin)
command = data.get('command', '')

dangerous = ['rm -rf', 'DROP TABLE', '> /dev/']
if any(d in command for d in dangerous):
    print('BLOCKED: dangerous command', file=sys.stderr)
    sys.exit(2)

sys.exit(0)`)
)}
${card("🏗️","SDK hooks — native functions (no shell scripts)","In the Agent SDK hooks are callback functions in your own language","#dc2626",
  code(`# Python SDK — hook is an async function
async def guard_bash(hook_input, tool_use_id, context):
    cmd = hook_input.tool_input.get('command', '')
    if 'rm -rf' in cmd:
        return {'behavior': 'deny', 'message': 'Blocked'}
    return {'behavior': 'allow'}

// TypeScript SDK — hook is an async function
async function guardBash(hookInput, toolUseId, context) {
  const cmd = hookInput.tool_input?.command ?? '';
  if (cmd.includes('rm -rf')) {
    return { behavior: 'deny', message: 'Blocked' };
  }
  return { behavior: 'allow' };
}`)
)}
`,

#
# Example: block any command that tries to delete files

import asyncio, json
from claude_agent_sdk import query, ClaudeAgentOptions

# This function runs before EVERY tool Claude tries to use
async def safety_check(hook_input, tool_use_id, context):

    # Only check Bash commands (not file reads)
    if hook_input.tool_name == "Bash":
        command = hook_input.tool_input.get("command", "")

# Install: pip install flask anthropic
#

#   - User sees words appear immediately (like ChatGPT)
#   - No long wait for the full response
#   - Uses Server-Sent Events (SSE) — the browser listens to a stream
#
# POST /ask/stream
# Body: {"task": "your question"}

from flask import Flask, request, Response, stream_with_context
import anthropic, json

app = Flask(__name__)
client = anthropic.Anthropic()

@app.route("/ask/stream", methods=["POST"])
def ask_stream():
    data = request.get_json()
    task = data.get("task", "")

    def generate():
        # Stream tokens from Claude as they arrive
        with client.messages.stream(
            model="claude-opus-4-8",
            max_tokens=1024,
            messages=[{"role": "user", "content": task}]
        ) as stream:
            for text_chunk in stream.text_stream:
                # Send each chunk to the browser immediately
                # Format: "data: {...}\n\n" is the SSE format browsers understand
                yield "data: " + json.dumps({"text": text_chunk}) + "\n\n"

        # Tell the browser we are done
        yield "data: " + json.dumps({"done": True}) + "\n\n"

    return Response(
        stream_with_context(generate()),
        mimetype="text/event-stream",
        headers={"Cache-Control": "no-cache", "X-Accel-Buffering": "no"}

${card("🗃️","Background jobs — for tasks that take a long time","If a task takes minutes, do not make the user wait. Run it in the background.","#16a34a",
  code(`# background_jobs.py
# Install: pip install flask anthropic
#
# Pattern:
#   1. User submits a task -> gets back a job_id immediately
#   2. Task runs in the background (could take minutes)
#   3. User polls GET /jobs/<job_id> to check progress
#   4. When done, result is returned
#
# This is like ordering food online:
#   You place the order (step 1)
#   Kitchen makes it (step 2)
#   You check the app for updates (step 3)
#   Food arrives (step 4)

from flask import Flask, request, jsonify
import anthropic, threading, uuid, time

app = Flask(__name__)
client = anthropic.Anthropic()

# In-memory job store — fine for learning, but:
# - Data is lost when the server restarts
# - Does not work with multiple server processes
# In production: use a real database (PostgreSQL, Redis, SQLite)
jobs = {}  # job_id -> {status, result, error}

# Each user only sees their own jobs — never expose all jobs to a user
# In production: store user_id with each job and filter by it

def run_claude_task(job_id: str, task: str):
    """This runs in the background on a separate thread."""
    jobs[job_id]["status"] = "running"
    try:
        response = client.messages.create(
            model="claude-opus-4-8",
            max_tokens=4096,
            messages=[{"role": "user", "content": task}]
        )
        jobs[job_id]["status"] = "done"
        jobs[job_id]["result"] = response.content[0].text
    except Exception as e:
        jobs[job_id]["status"] = "failed"
        jobs[job_id]["error"] = str(e)

@app.route("/jobs", methods=["POST"])
def submit_job():
    """Submit a task. Returns job_id immediately — does not wait."""
    task = request.get_json().get("task", "")
    job_id = str(uuid.uuid4())[:8]   # short random ID like "a3f9b2c1"
    jobs[job_id] = {"status": "queued", "result": None, "error": None}

    # Start the task on a background thread — does not block the response
    thread = threading.Thread(target=run_claude_task, args=(job_id, task))
    thread.daemon = True
    thread.start()

    return jsonify({"job_id": job_id, "message": "Task started"})

@app.route("/jobs/<job_id>", methods=["GET"])
def get_job(job_id: str):
    """Check the status of a job."""
    if job_id not in jobs:
        return jsonify({"error": "Job not found"}), 404
    return jsonify(jobs[job_id])

if __name__ == "__main__":
    app.run(debug=True, port=5000)

# Usage:
# 1. Submit: curl -X POST http://localhost:5000/jobs -d '{"task":"Review src/"}' -H "Content-Type: application/json"
#    Returns: {"job_id": "a3f9b2c1", "message": "Task started"}
#
# 2. Poll:   curl http://localhost:5000/jobs/a3f9b2c1
#    Returns: {"status": "running", "result": null}
#    Later:   {"status": "done", "result": "Here is the review..."}`)
)}

${card("💰","Cost control — stop Claude from spending too much","Each Claude API call costs money. Without limits, one bad prompt could cost you a lot.","#b91c1c",
  code(`# cost_control.py
# Install: pip install anthropic
#
# The problem: if someone sends "write me 10,000 lines of code"
# Claude will happily do it — and your bill will be huge.
#
# The solution: track spending per user and set limits.

import anthropic
from datetime import date

client = anthropic.Anthropic()

# Simple spending tracker (use a database in production)
spending = {}  # user_id -> {date: total_cost_in_dollars}

DAILY_LIMIT_DOLLARS = 1.00   # max $1 per user per day
TASK_LIMIT_DOLLARS  = 0.10   # max $0.10 per single request

def get_todays_spending(user_id: str) -> float:
    today = str(date.today())
    user = spending.get(user_id, {})
    return user.get(today, 0.0)

def record_spending(user_id: str, cost: float):
    today = str(date.today())
    if user_id not in spending:
        spending[user_id] = {}
    spending[user_id][today] = spending[user_id].get(today, 0) + cost

def ask_claude_with_limit(user_id: str, task: str) -> str:
    # 1. Check if user has exceeded daily limit
    todays_spend = get_todays_spending(user_id)
    if todays_spend >= DAILY_LIMIT_DOLLARS:
        return f"Sorry, you have reached your daily limit of \${DAILY_LIMIT_DOLLARS:.2f}"

    # 2. Count tokens BEFORE making the full call (this is free)
    token_count = client.messages.count_tokens(
        model="claude-opus-4-8",
        messages=[{"role": "user", "content": task}]
    )
    estimated_cost = token_count.input_tokens / 1_000_000 * 15  # $15 per million tokens
    print(f"  Estimated cost: \${estimated_cost:.4f}")

    if estimated_cost > TASK_LIMIT_DOLLARS:
        return f"Task too expensive (\${estimated_cost:.2f}). Please make your request shorter."

    # 3. Make the real call
    response = client.messages.create(
        model="claude-opus-4-8",
        max_tokens=1024,
        messages=[{"role": "user", "content": task}]
    )

    # 4. Record actual cost
    actual_cost = (response.usage.input_tokens + response.usage.output_tokens) / 1_000_000 * 15
    record_spending(user_id, actual_cost)
    print(f"  Actual cost: \${actual_cost:.4f} | Today's total: \${get_todays_spending(user_id):.4f}")

    return response.content[0].text

# Try it:
result = ask_claude_with_limit("user123", "What is 2 + 2?")
print(result)`)
)}

${card("🚦","Rate limiting — stop users from spamming requests","Without limits, one user could make thousands of requests and slow down everyone else.","#b91c1c",
  code(`# rate_limit.py
#
# Rate limiting means: each user can only make N requests per minute.
# If they go over, they get an error and have to wait.
#
# Example limits we will enforce:
#   - Max 5 requests per minute per user
#   - Max 2 requests running at the same time per user

from datetime import datetime, timedelta
from collections import defaultdict

class SimpleRateLimiter:
    """
    Tracks how many requests each user has made recently.
    Think of it like a bouncer at a club counting how many times
    each person has entered in the last hour.
    """

    MAX_PER_MINUTE = 5    # max 5 calls per user per minute
    MAX_CONCURRENT = 2    # max 2 calls running at the same time per user

    def __init__(self):
        # timestamps of recent requests per user
        self.request_times = defaultdict(list)
        # count of currently running requests per user
        self.running = defaultdict(int)

    def can_make_request(self, user_id: str) -> tuple[bool, str]:
        """Returns (allowed, reason). Call this BEFORE making a Claude call."""

        # Remove timestamps older than 1 minute
        now = datetime.utcnow()
        one_minute_ago = now - timedelta(minutes=1)
        self.request_times[user_id] = [
            t for t in self.request_times[user_id] if t > one_minute_ago
        ]

        # Check: too many concurrent requests?
        if self.running[user_id] >= self.MAX_CONCURRENT:
            return False, f"You already have {self.MAX_CONCURRENT} requests running. Please wait."

        # Check: too many requests this minute?
        if len(self.request_times[user_id]) >= self.MAX_PER_MINUTE:
            return False, f"Too many requests. Limit is {self.MAX_PER_MINUTE} per minute."

        return True, ""

    def start(self, user_id: str):
        """Call this when a request starts."""
        self.request_times[user_id].append(datetime.utcnow())
        self.running[user_id] += 1

    def finish(self, user_id: str):
        """Call this when a request finishes (even if it errored)."""
        self.running[user_id] = max(0, self.running[user_id] - 1)

# How to use it in your Flask app:
limiter = SimpleRateLimiter()

# In your endpoint:
# allowed, reason = limiter.can_make_request(user_id)
# if not allowed:
#     return jsonify({"error": reason}), 429   # 429 = Too Many Requests
# limiter.start(user_id)
# try:
#     result = call_claude(...)
# finally:
#     limiter.finish(user_id)   # always release even if error`)
)}

${card("💬","Multi-turn conversations","Claude has no memory between calls. You keep the history and send it every time.","#0284c7",
  code(`import anthropic

# How Claude "remembers" previous messages:
# There is no magic memory. You simply keep a list of all messages
# and send the full list on every API call. That is it.
#
# Each user/session gets their OWN separate history list.
# Do not share one history list between users.

client = anthropic.Anthropic()

def new_conversation():
    """Create a fresh conversation. Call this once per user session."""
    return []   # empty list = new conversation

def chat(history, user_message):
    """
    Send a message and get a reply.
    history = the list for THIS user's conversation (not shared).
    Returns (reply_text, updated_history).
    """
    # Add the user's message to history
    history.append({"role": "user", "content": user_message})

    # Send the FULL history to Claude every time
    response = client.messages.create(
        model="claude-opus-4-8",
        max_tokens=1024,
        system="You are a senior code reviewer. Be concise.",
        messages=history   # <-- all previous messages included
    )

    reply = response.content[0].text

    # Add Claude's reply to history
    history.append({"role": "assistant", "content": reply})

    return reply, history

# Usage — one conversation:
history = new_conversation()
reply, history = chat(history, "Review src/auth.ts for security issues")
print(reply)
reply, history = chat(history, "How do I fix the top 3 issues?")
print(reply)
reply, history = chat(history, "Write tests for those fixes")
print(reply)

# For a web app: store history in the user's session or database
# so it persists between HTTP requests. Example:
#   history = db.get_conversation(user_id)   # load
#   reply, history = chat(history, message)
#   db.save_conversation(user_id, history)   # save`)

subprocess: ()=> `
${p("A subprocess means your Python (or any language) script runs Claude Code as a separate program and captures its output. It is the simplest way to give Claude access to your actual project files from any backend.")}
${box("tip","<b>When to use this:</b> You want Claude to read real files in a project folder and use tools — but you do not want to use the Agent SDK. Just call <code>claude -p</code> as a subprocess.")}
${box("warn","<b>Requirement:</b> Claude Code CLI must be installed on the server: <code>npm install -g @anthropic-ai/claude-code</code> and ANTHROPIC_API_KEY must be set.")}

${h2("How it works")}
${code(`# You run this command:  claude -p "your task" --output-format json
# Claude reads your project files, does the task, prints JSON result.
# Your script captures that JSON and uses the result.
#
# Three output formats:
#   --output-format text        plain text
#   --output-format json        {"result": "..."} easy for code to parse
#   --output-format stream-json one JSON event per line as Claude works`)}

${card("🐍","Python — simple version","Run Claude, wait for result, return it. The foundation of everything.","#166534",
  code(`# subprocess_simple.py
# subprocess.run() is like opening a terminal and running a command.
# capture_output=True captures what Claude prints.
# cwd sets which folder Claude works in (so it can see your files).

import subprocess, json, os

def ask_claude(task, project_folder):
    result = subprocess.run(
        ["claude", "-p", task, "--output-format", "json"],
        capture_output=True,    # capture stdout + stderr
        text=True,              # return strings not bytes
        cwd=project_folder,     # Claude reads files from this folder
        env=os.environ.copy(),  # pass ANTHROPIC_API_KEY through
        timeout=120             # stop after 2 minutes
    )

    if result.returncode != 0:
        raise Exception("Claude failed: " + result.stderr)

    # Claude prints JSON. Parse it and return the text result.
    return json.loads(result.stdout)["result"]

# Try it:
answer = ask_claude(
    task="List all Python files and what each one does",
    project_folder="/path/to/your/project"
)
print(answer)`)
)}

${card("🐍","Python — streaming version","Show output word by word as Claude works — good for long tasks.","#166534",
  code(`# subprocess_stream.py
# Popen starts Claude without waiting for it to finish.
# We then read one line at a time and yield text chunks.

import subprocess, json, os

def stream_claude(task, project_folder):
    process = subprocess.Popen(
        ["claude", "-p", task, "--output-format", "stream-json"],
        stdout=subprocess.PIPE,
        text=True,
        cwd=project_folder,
        env=os.environ.copy()
    )

    for line in process.stdout:
        line = line.strip()
        if not line:
            continue
        try:
            event = json.loads(line)
            # "assistant" events contain text Claude is currently writing
            if event.get("type") == "assistant":
                for block in event.get("message", {}).get("content", []):
                    if block.get("type") == "text":
                        yield block["text"]
            elif event.get("type") == "result":
                return  # Claude finished
        except json.JSONDecodeError:
            pass
    process.wait()

# Print each chunk as it arrives:
for chunk in stream_claude("Explain this project's architecture", "/path/to/project"):
    print(chunk, end="", flush=True)`)
)}

${card("🌐","Flask endpoint using subprocess","A full web endpoint that calls Claude and returns the result.","#166534",
  code(`# flask_subprocess.py
# pip install flask
#
# POST /review
# Body: {"task": "...", "folder": "/projects/myapp"}
# Returns: {"result": "Claude's answer"}

from flask import Flask, request, jsonify
import subprocess, json, os

app = Flask(__name__)

@app.route("/review", methods=["POST"])
def review():
    data = request.get_json()
    task = data.get("task", "")
    folder = os.path.realpath(data.get("folder", "."))

    # Safety: only allow folders inside /projects/
    if not folder.startswith("/projects/"):
        return jsonify({"error": "Folder not allowed"}), 403

    try:
        result = subprocess.run(
            ["claude", "-p", task,
             "--output-format", "json",
             "--permission-mode", "plan"],  # read-only: Claude cannot edit files
            capture_output=True, text=True,
            cwd=folder, env=os.environ.copy(), timeout=60
        )
        if result.returncode != 0:
            return jsonify({"error": result.stderr[:200]}), 500

        return jsonify({"result": json.loads(result.stdout)["result"]})

    except subprocess.TimeoutExpired:
        return jsonify({"error": "Timed out"}), 504

if __name__ == "__main__":
    app.run(port=5000)`)
)}
