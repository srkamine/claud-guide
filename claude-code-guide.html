<!DOCTYPE html>

<head>

<title>Claude Code — CLI to Production Guide</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,sans-serif;background:#f8fafc;color:#1e293b}
  a{color:inherit}

  /* Header */
  .header{background:linear-gradient(135deg,#1e1b4b,#312e81 55%,#4338ca);padding:24px 20px 16px;color:#fff}
  .header-inner{max-width:860px;margin:0 auto}
  .header-eyebrow{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#a5b4fc;margin-bottom:4px;font-weight:700}
  .header h1{font-size:22px;font-weight:800;margin-bottom:4px}
  .header p{font-size:12px;color:#c7d2fe}

  /* Nav */
  .nav{background:#fff;border-bottom:1px solid #e2e8f0;position:sticky;top:0;z-index:100;overflow-x:auto}
  .nav-inner{max-width:860px;margin:0 auto;display:flex;white-space:nowrap;padding:0 4px}
  .nav-btn{padding:10px 11px;border:none;background:none;cursor:pointer;font-size:11.5px;font-weight:500;color:#64748b;border-bottom:3px solid transparent;white-space:nowrap;flex-shrink:0;transition:all .15s;font-family:inherit}
  .nav-btn:hover{color:#1e293b}
  .nav-btn.active{font-weight:700;border-bottom-color:var(--c)}
  .nav-btn.prod{background:#fdf4ff;color:#9333ea}
  .nav-btn.prod.active{color:var(--c)}

  /* Content */
  .content{max-width:860px;margin:0 auto;padding:20px 14px 60px}
  .section-header{border-radius:10px;padding:12px 16px;margin-bottom:18px;border:1px solid rgba(0,0,0,.06)}
  .section-header h2{font-size:17px;font-weight:800}
  .section-tag{font-size:10.5px;font-weight:700;color:#9333ea;margin-top:2px}

  /* Typography */
  .p{font-size:13.5px;color:#475569;line-height:1.75;margin:8px 0}
  .h2{font-size:14.5px;font-weight:800;color:#1e293b;margin:20px 0 8px;border-bottom:1px solid #f1f5f9;padding-bottom:5px}

  /* Code blocks */
  .code-wrap{position:relative;margin:10px 0}
  .code-wrap pre{background:#0f172a;color:#e2e8f0;border-radius:9px;padding:13px 16px;font-size:12px;line-height:1.72;overflow-x:auto;white-space:pre-wrap;word-break:break-word;font-family:'JetBrains Mono','Fira Code',monospace;border:1px solid #1e293b}
  .copy-btn{position:absolute;top:8px;right:8px;background:#334155;color:#fff;border:none;border-radius:5px;padding:3px 9px;font-size:11px;cursor:pointer;font-weight:700;font-family:inherit;transition:background .2s}
  .copy-btn:hover{background:#475569}
  .copy-btn.ok{background:#22c55e}

  /* Cards */
  .card{border-radius:9px;margin-bottom:12px;background:#fff;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.05);border:1px solid rgba(0,0,0,.06)}
  .card-border{border-left:4px solid var(--c)}
  .card-header{padding:12px 14px;cursor:pointer;display:flex;align-items:center;gap:11px;user-select:none}
  .card-icon{font-size:19px;flex-shrink:0}
  .card-title{font-weight:700;font-size:13.5px;color:#1e293b}
  .card-sub{font-size:11.5px;color:#64748b;margin-top:1px}
  .card-arrow{color:#94a3b8;font-size:13px;margin-left:auto;flex-shrink:0}
  .card-body{padding:0 14px 14px;border-top:1px solid rgba(0,0,0,.04);display:none}
  .card-body.open{display:block}
  .card-body-inner{padding-top:10px}

  /* Boxes */
  .box{border-radius:0 7px 7px 0;padding:9px 13px;margin:10px 0;font-size:13px;color:#1e293b;line-height:1.6}
  .box-tip{background:#f0fdf4;border-left:3px solid #16a34a}
  .box-info{background:#eff6ff;border-left:3px solid #2563eb}
  .box-warn{background:#fffbeb;border-left:3px solid #d97706}
  .box b{font-weight:700}

  /* Grid */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
  .grid-pill{background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:8px;padding:10px 12px;display:flex;gap:9px;align-items:flex-start}
  .grid-pill-icon{font-size:17px}
  .grid-pill-label{font-weight:700;font-size:12px;color:#1e293b}
  .grid-pill-desc{font-size:11px;color:#64748b;margin-top:2px}

  /* Plan mode comparison */
  .plan-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
  .plan-box{border-radius:7px;padding:10px 12px}
  .plan-box-blue{background:#f0f9ff;border:1px solid #bae6fd}
  .plan-box-green{background:#f0fdf4;border:1px solid #bbf7d0}
  .plan-box-label{font-weight:800;font-size:12px;margin-bottom:3px}
  .plan-box-desc{font-size:12px;color:#475569;line-height:1.6}

  /* GitHub badge */
  .gh-badge{display:inline-flex;align-items:center;gap:6px;background:#24292f;color:#fff;padding:6px 14px;border-radius:6px;font-size:12px;font-weight:600;text-decoration:none;margin-top:8px}
  .gh-badge:hover{background:#444d56}

  /* Footer */
  .footer{text-align:center;padding:40px 20px;color:#94a3b8;font-size:12px;border-top:1px solid #e2e8f0;margin-top:40px}

  @media(max-width:600px){
    .grid2,.plan-grid{grid-template-columns:1fr}
    .header h1{font-size:18px}
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="header-eyebrow">Practical Learning Guide — 2026</div>
    <h1>Claude Code — CLI to Production</h1>
    <p>14 sections · Tools explained · Agents & settings · Custom MCP · Backend integration patterns</p>
    <a class="gh-badge" href="https://github.com" target="_blank">
      ⭐ Star on GitHub

<div class="nav" id="nav">
  <div class="nav-inner" id="nav-inner"></div>

<div class="content" id="content"></div>

<script>
// ── Data ─────────────────────────────────────────────────────────────────────

const SECTIONS = [
  {id:"setup",    label:"⚙️ Setup",        title:"Installation & First Session",     color:"#6366f1", bg:"#eef2ff"},
  {id:"apibasics",label:"🔑 API Basics",   title:"Your First API Call — Zero to Working", color:"#0891b2", bg:"#ecfeff"},
  {id:"claudemd", label:"📋 CLAUDE.md",    title:"CLAUDE.md — Project Memory",       color:"#0f766e", bg:"#f0fdfa"},
  {id:"commands", label:"⌨️ Commands",      title:"Slash Commands & Shortcuts",       color:"#0369a1", bg:"#f0f9ff"},
  {id:"tools",    label:"🔧 Tools",         title:"Built-in Tools — Each Explained",  color:"#059669", bg:"#ecfdf5"},
  {id:"planmode", label:"📐 Plan Mode",     title:"Plan Mode — Two Different Ways",   color:"#b45309", bg:"#fffbeb"},
  {id:"agents",   label:"🤖 Agents",        title:"Agents & settings.json Explained", color:"#7c3aed", bg:"#f5f3ff"},
  {id:"skills",   label:"🎯 Skills",         title:"Skills — Reusable Workflows",      color:"#be185d", bg:"#fdf2f8"},
  {id:"hooks",    label:"🪝 Hooks",          title:"Hooks — Lifecycle Automation",     color:"#dc2626", bg:"#fef2f2"},
  {id:"mcp",      label:"🔌 MCP",           title:"MCP — Pre-built & Custom Servers", color:"#d97706", bg:"#fffbeb"},
  {id:"multi",    label:"🧩 Multi-Agent",   title:"Multi-Agent Patterns",             color:"#9333ea", bg:"#faf5ff"},
  {id:"headless", label:"🚀 Headless/CI",   title:"Headless Mode & CI/CD",            color:"#475569", bg:"#f8fafc"},
  {id:"sdk",      label:"🏗️ Agent SDK",     title:"Agent SDK — Embed in Your App",    color:"#c026d3", bg:"#fdf4ff"},
  {id:"backend",  label:"🖥️ Backend",       title:"Backend Integration Patterns",     color:"#16a34a", bg:"#f0fdf4"},
  {id:"prod",     label:"🔐 Production",    title:"Production: Security & Scale",     color:"#b91c1c", bg:"#fef2f2"},
];
const PROD = new Set(["sdk","backend","prod","apibasics"]);
let active = "setup";

// ── Helpers ───────────────────────────────────────────────────────────────────

function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;") }

function code(text){
  return `<div class="code-wrap">
    <pre>${esc(text)}</pre>
    <button class="copy-btn" onclick="copyCode(this)">Copy</button>
  </div>`;
}

function box(type, html){
  return `<div class="box box-${type}">${html}</div>`;
}

function card(icon, title, sub, color, html){
  const id = "c" + Math.random().toString(36).slice(2);
  return `<div class="card card-border" style="--c:${color}">
    <div class="card-header" onclick="toggleCard('${id}')">
      <span class="card-icon">${icon}</span>
      <div><div class="card-title">${title}</div>${sub?`<div class="card-sub">${sub}</div>`:""}
      </div><span class="card-arrow" id="arr-${id}">▼</span>
    </div>
    <div class="card-body" id="${id}">
      <div class="card-body-inner">${html}</div>
    </div>
  </div>`;
}

function h2(t){ return `<div class="h2">${t}</div>` }
function p(t){ return `<p class="p">${t}</p>` }
function pill(icon,label,desc){ return `<div class="grid-pill"><span class="grid-pill-icon">${icon}</span><div><div class="grid-pill-label">${label}</div><div class="grid-pill-desc">${desc}</div></div></div>` }

function copyCode(btn){
  const text = btn.previousElementSibling.textContent;
  navigator.clipboard.writeText(text).then(()=>{
    btn.textContent="✓"; btn.classList.add("ok");
    setTimeout(()=>{btn.textContent="Copy";btn.classList.remove("ok")},2000);
  });
}

function toggleCard(id){
  const body = document.getElementById(id);
  const arr  = document.getElementById("arr-"+id);
  const open = body.classList.toggle("open");
  arr.textContent = open ? "▲" : "▼";
}

// ── Section renderers ──────────────────────────────────────────────────────────

const CONTENT = {

setup: ()=> `
${p("Claude Code is a terminal AI agent that runs in your shell. Follow every step below exactly — skip nothing. You will go from zero to a working first session.")}

${h2("Step 1 — Check prerequisites")}
${code(`# Check Node.js version (need 18+):
node --version
# If you see v18.x, v20.x, or higher → you are good
# If you see v16.x or lower, or 'command not found' → install Node.js first

# Install Node.js if needed:
# macOS:  brew install node
# Ubuntu: sudo apt install nodejs npm
# Windows: download from https://nodejs.org → choose LTS

# Check npm is available:
npm --version
# Should print something like 9.x or 10.x`)}

${h2("Step 2 — Install Claude Code")}
${code(`# OPTION A — Native binary (recommended, fastest):
curl -fsSL https://claude.ai/install.sh | bash

# OPTION B — macOS Homebrew:
brew install --cask claude-code

# OPTION C — npm (works everywhere Node is installed):
npm install -g @anthropic-ai/claude-code

# After install, verify it worked:
claude --version
# Should print: claude-code 1.x.x (or similar)
# If 'command not found' → close terminal, reopen, try again`)}

${h2("Step 3 — Fix PATH so your terminal finds 'claude'")}
${p("This is the most common step people skip and then wonder why <code>claude: command not found</code> appears. After installing, your shell needs to know WHERE the claude binary lives. That location must be in your PATH.")}

${box("warn","<b>⚠️ Most common issue after install:</b> You run <code>claude</code> and get <code>command not found</code> even though install said it succeeded. This is a PATH problem — not an install failure. Fix it with the steps below before doing anything else.")}

${h2("What PATH actually is")}
${code(`# PATH is a list of folders your shell searches when you type a command.
# When you type: claude
# Your shell looks through each folder in PATH, in order, for a file named 'claude'.
# If it finds it -> runs it.
# If it does not find it -> prints 'command not found'.

# See your current PATH:
echo \$PATH
# Typical output (colon-separated list of folders):
# /usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:/home/you/.local/bin

# See WHERE claude was installed (after a successful install):
which claude          # prints the full path if it's in PATH
whereis claude        # broader search (Linux)
find / -name claude -type f 2>/dev/null   # brute-force search everywhere`)}

${h2("Step 3a — Find where claude was installed")}
${code(`# The install location depends on HOW you installed it.
# Run the one that matches your install method:

# If you used the curl installer (native binary):
ls ~/.local/bin/claude        # Linux — most common
ls /usr/local/bin/claude      # macOS — most common
ls ~/bin/claude               # some Linux configs

# If you used npm install -g:
npm root -g                   # shows global npm folder
# claude will be in: $(npm root -g)/../bin/claude
# Example: /usr/local/lib/node_modules/.bin/claude or /usr/local/bin/claude
ls $(npm root -g)/../bin/claude

# If you used Homebrew:
ls /opt/homebrew/bin/claude   # Apple Silicon Mac (M1/M2/M3/M4)
ls /usr/local/bin/claude      # Intel Mac

# Once you find the path, note the FOLDER (not the file):
# If claude is at ~/.local/bin/claude -> the folder is ~/.local/bin
# If claude is at /usr/local/bin/claude -> the folder is /usr/local/bin`)}

${h2("Step 3b — Check if that folder is in PATH")}
${code(`# After you find the folder where claude lives, check if it's in PATH:
echo \$PATH | tr ':' '\n'
# This prints each PATH entry on its own line — easier to read.

# Example output:
# /usr/local/bin        <- is your folder here?
# /usr/bin
# /bin
# /usr/sbin
# /sbin
# /home/you/.nvm/versions/node/v20.0.0/bin
# /home/you/.local/bin  <- is your folder here?

# If you see the folder -> PATH is fine, try opening a NEW terminal window.
# If you do NOT see the folder -> you need to add it. Continue to Step 3c.`)}

${h2("Step 3c — Add the folder to PATH permanently")}
${card("🍎","macOS — zsh (default since macOS Catalina 2019)","Most Mac users: add to ~/.zshrc","#6366f1",
  code(`# Step 1: Identify which shell profile file to edit.
# macOS uses zsh by default. Your profile file is ~/.zshrc
# Confirm:
echo \$SHELL
# Should print: /bin/zsh

# Step 2: Open ~/.zshrc in a text editor:
nano ~/.zshrc
# OR: open -e ~/.zshrc   (opens in TextEdit)
# OR: code ~/.zshrc      (opens in VS Code if installed)

# Step 3: Scroll to the END of the file and add this line.
# Replace the path with wherever claude was installed:
export PATH="\$HOME/.local/bin:\$PATH"
# OR if installed via npm globally:
export PATH="/usr/local/bin:\$PATH"
# OR if on Apple Silicon Mac with Homebrew:
export PATH="/opt/homebrew/bin:\$PATH"

# Step 4: Save the file:
# In nano: press Ctrl+O, then Enter to save, then Ctrl+X to exit

# Step 5: Reload the profile (apply changes to current terminal):
source ~/.zshrc

# Step 6: Verify:
which claude
# Should print: /Users/yourname/.local/bin/claude  (or wherever it is)
claude --version
# Should print the version number`)
)}
${card("🐧","Linux — bash (most common Linux shell)","Most Linux users: add to ~/.bashrc or ~/.bash_profile","#6366f1",
  code(`# Step 1: Confirm your shell:
echo \$SHELL
# /bin/bash -> use ~/.bashrc (interactive shells) or ~/.bash_profile (login shells)
# Ubuntu/Debian: use ~/.bashrc
# CentOS/RHEL/Fedora: use ~/.bash_profile

# Step 2: Open the file:
nano ~/.bashrc
# OR: gedit ~/.bashrc   (if you have a GUI)

# Step 3: Add at the END of the file:
export PATH="\$HOME/.local/bin:\$PATH"
# Adjust path as needed based on what you found in Step 3a

# Step 4: Save and apply:
source ~/.bashrc
# OR for .bash_profile:
source ~/.bash_profile

# Step 5: Verify:
which claude
claude --version

# IMPORTANT: If you edit .bashrc but login via SSH, you may also need .bash_profile.
# Add this to ~/.bash_profile to make .bashrc load on login:
if [ -f ~/.bashrc ]; then
    source ~/.bashrc
fi`)
)}
${card("🪟","Windows — PowerShell and WSL","Windows has two environments — handle them separately","#6366f1",
  code(`# ── OPTION A: Windows Subsystem for Linux (WSL) ──────────────────────
# If you installed claude inside WSL (Ubuntu/Debian on Windows):
# Follow the Linux bash instructions above — they apply inside WSL.
# Your profile file is: ~/.bashrc or ~/.bash_profile inside WSL.

# ── OPTION B: PowerShell (native Windows, no WSL) ─────────────────────
# Step 1: Find where npm put claude:
npm root -g
# Example output: C:\Users\YourName\AppData\Roaming\npm\node_modules
# Claude binary is at: C:\Users\YourName\AppData\Roaming\npm\claude.cmd

# Step 2: Check current PATH in PowerShell:
\$env:PATH -split ';'

# Step 3: Add to PATH permanently via System Settings:
# Search for "Environment Variables" in Windows Start menu
# Click "Environment Variables" button
# Under "User variables", find "Path" and click Edit
# Click "New" and add: C:\Users\YourName\AppData\Roaming\npm
# Click OK on all dialogs

# Step 4: Close ALL PowerShell windows and reopen.
# Verify:
where.exe claude
claude --version

# ── OPTION C: Git Bash on Windows ─────────────────────────────────────
# Git Bash uses bash. Add to ~/.bash_profile:
export PATH="\$HOME/AppData/Roaming/npm:\$PATH"
source ~/.bash_profile`)
)}
${card("🐟","fish shell users","fish uses a different syntax — not export PATH=...","#6366f1",
  code(`# fish shell does NOT use export PATH="...:\$PATH" syntax.
# It has its own command for setting PATH.

# Step 1: Confirm you are using fish:
echo \$SHELL
# /usr/bin/fish  or  /opt/homebrew/bin/fish

# Step 2: Add the directory to fish PATH:
fish_add_path ~/.local/bin
# OR for npm global:
fish_add_path /usr/local/bin
# OR for Homebrew on Apple Silicon:
fish_add_path /opt/homebrew/bin

# fish_add_path is permanent — it writes to ~/.config/fish/config.fish automatically.
# No source needed. Open a new terminal and test.

# Verify:
which claude
claude --version

# If fish_add_path is not available (older fish):
# Edit ~/.config/fish/config.fish manually and add:
set -gx PATH ~/.local/bin \$PATH`)
)}

${h2("Step 3d — Special case: nvm (Node Version Manager)")}
${code(`# If you manage Node.js with nvm, npm global installs go into nvm's folder.
# This folder changes every time you switch Node versions!
# That's why claude disappears after 'nvm use 20' -> 'nvm use 18'.

# Check if you're using nvm:
command -v nvm
# If this prints 'nvm', you're using it.

# Find where nvm puts global npm binaries:
nvm which current
# Example: /home/you/.nvm/versions/node/v20.11.0/bin/node
# npm global binaries go in the same bin/ folder:
ls ~/.nvm/versions/node/v20.11.0/bin/claude

# THE PROBLEM: each node version has its own bin/ folder.
# If you install claude with node v20, switch to v18, claude is gone.

# SOLUTION A: Always install claude after switching Node versions:
nvm use 20
npm install -g @anthropic-ai/claude-code
nvm use 18
npm install -g @anthropic-ai/claude-code

# SOLUTION B: Use the curl installer (native binary) — bypasses nvm entirely.
# The curl installer puts claude in ~/.local/bin which nvm doesn't touch.
curl -fsSL https://claude.ai/install.sh | bash
# Then add ~/.local/bin to PATH (see Step 3c above).
# This is the recommended approach if you use nvm.

# SOLUTION C: Set a default nvm version and install claude once there:
nvm alias default 20
nvm use default
npm install -g @anthropic-ai/claude-code
# Now claude is in the 'default' node version's bin — always available.`)}

${h2("Step 3e — Special case: pyenv / asdf / volta")}
${code(`# Similar version managers have the same issue as nvm.

# ── VOLTA (JavaScript tool manager) ───────────────────────────────────
# Volta manages its own shims. If you installed node via volta:
volta install node         # installs node
npm install -g @anthropic-ai/claude-code
# volta should automatically shim claude into ~/.volta/bin/
ls ~/.volta/bin/claude
# Add ~/.volta/bin to PATH if not already there:
export PATH="\$HOME/.volta/bin:\$PATH"

# ── ASDF ────────────────────────────────────────────────────────────
# asdf puts globals in ~/.asdf/shims/
# After 'npm install -g claude-code':
ls ~/.asdf/shims/claude
# Add to PATH:
export PATH="\$HOME/.asdf/shims:\$HOME/.asdf/bin:\$PATH"
# Or use asdf's own PATH setup — add to ~/.bashrc:
. \$HOME/.asdf/asdf.sh`)}

${h2("Step 3f — Verify PATH is set up correctly")}
${code(`# Run these checks IN ORDER. All must pass before continuing.

# CHECK 1: Can your shell find claude?
which claude
# PASS: prints a path like /usr/local/bin/claude
# FAIL: prints nothing or 'claude not found' -> PATH is not set. Redo Step 3c.

# CHECK 2: Does it run?
claude --version
# PASS: prints something like 'claude-code 1.x.x'
# FAIL: 'Permission denied' -> run: chmod +x \$(which claude)
# FAIL: 'command not found' -> PATH still not set

# CHECK 3: Does it survive opening a new terminal?
# Open a brand new terminal window (not just a new tab — a full new window).
claude --version
# PASS: works without you doing anything
# FAIL: works in old terminal but not new one
# -> your profile file changes did not save, or you edited the wrong file

# CHECK 4: Does it survive a system restart?
# Restart your computer and open a terminal:
claude --version
# PASS: works after restart
# FAIL: only worked until restart
# -> you used 'export PATH=...' directly in terminal (temporary) instead of
#    adding it to the profile file (permanent)`)}

${h2("Step 3g — Common error messages and exact fixes")}
${card("❌","'claude: command not found' after install","The most common issue — shell cannot find the binary","#dc2626",
  code(`# DIAGNOSIS: Run this to find where claude actually is:
find \$HOME -name "claude" -type f 2>/dev/null
find /usr -name "claude" -type f 2>/dev/null
find /opt -name "claude" -type f 2>/dev/null

# Once you find the path (e.g. /home/you/.local/bin/claude):
# 1. Extract the directory: /home/you/.local/bin
# 2. Add to profile (for bash):
echo 'export PATH="\$HOME/.local/bin:\$PATH"' >> ~/.bashrc
source ~/.bashrc

# 3. Verify:
which claude && echo "SUCCESS" || echo "STILL NOT FOUND"

# QUICK TEMPORARY FIX (lasts until you close terminal):
export PATH="\$HOME/.local/bin:\$PATH"
claude --version   # test it
# Then go add it permanently to your profile file.`)
)}
${card("❌","'Permission denied' when running claude","Binary exists and is in PATH, but you cannot execute it","#dc2626",
  code(`# This means the file is not marked as executable.
# Fix: make it executable.

# Find claude:
which claude
# Example output: /home/you/.local/bin/claude

# Make it executable:
chmod +x \$(which claude)
# OR with the full path:
chmod +x /home/you/.local/bin/claude

# Verify it works:
claude --version`)
)}

claudemd: ()=> `
${p("CLAUDE.md is a plain text file that sits in your project root. Claude reads it automatically at the start of every session — it is persistent memory about your stack, rules, conventions, and architecture. This is the single most impactful thing you can do for any project.")}
${box("info","<b>ℹ️ Why this matters:</b> Without CLAUDE.md, Claude starts every session knowing nothing about your project — you repeat context every time. With CLAUDE.md, Claude already knows your stack, your rules, your folder structure, and what NOT to do before you type your first prompt.")}

${h2("Step 1 — Generate CLAUDE.md automatically with /init")}
${code(`# Navigate to your project root first:
cd ~/projects/my-app

# Launch Claude Code:
claude

# Run /init — Claude will scan your entire project:
/init

# What Claude does during /init:
# 1. Reads your package.json / pyproject.toml / Cargo.toml / etc.
# 2. Scans folder structure (src/, tests/, docs/, etc.)
# 3. Reads a sample of your actual source files
# 4. Detects your framework, testing setup, linting config
# 5. Writes CLAUDE.md to your project root

# After /init completes, review the generated file:
/memory

# Then open it in your editor to add missing rules:
cat CLAUDE.md`)}

${h2("Step 2 — Understand what to put in CLAUDE.md")}
${code(`# CLAUDE.md has 5 key sections. Fill all of them:

# 1. WHAT THIS IS — one paragraph describing the project
# 2. TECH STACK — every major dependency with versions
# 3. HOW TO RUN — exact commands to start dev server and tests
# 4. STRUCTURE — what each folder/file is responsible for
# 5. RULES — your coding standards Claude must follow always`)}

${card("📋","Complete CLAUDE.md template — copy and customize","Paste this, fill in your details, commit to git","#0f766e",
  code(`# Project: E-commerce API

## What this is
Node.js + Express + PostgreSQL REST API for an online store.
Users browse products, add to cart, checkout with Stripe.
Admins manage inventory through a separate admin portal.

## Tech stack
- Runtime:    Node.js 20 + TypeScript 5.3
- Framework:  Express 4.18
- Database:   PostgreSQL 15 — connection string in DATABASE_URL env var
- Auth:       JWT (jsonwebtoken) — refresh tokens stored in Redis
- Tests:      Vitest 1.x + Supertest for integration tests
- Linting:    ESLint + Prettier (config in .eslintrc.cjs)
- Build:      tsc -> dist/ (npm run build)

## How to run
npm install          # install dependencies (run once after cloning)
cp .env.example .env # set up environment variables
npm run dev          # start dev server on http://localhost:3000
npm test             # run all tests (requires DB running)
npm run lint         # check linting
npm run build        # compile TypeScript to dist/

## Folder structure
src/routes/          -> Express route handlers only (validate input, call service, send response)
src/services/        -> Business logic only (no direct DB calls, no HTTP concerns)
src/models/          -> All database queries (parameterized SQL only — never interpolated)
src/middleware/       -> Express middleware (auth, error handling, validation)
src/types/           -> TypeScript interfaces and type definitions
tests/routes/        -> Integration tests for routes (mirrors src/routes/)
tests/services/      -> Unit tests for services (mirrors src/services/)

## Rules — Claude must ALWAYS follow these
- Every new route handler needs a test in tests/routes/
- Business logic belongs in services/ — never in route handlers
- All SQL lives in models/ — never write SQL anywhere else
- camelCase for JS variables, PascalCase for TypeScript types/interfaces
- Named exports only — never use default exports
- All API responses must use format: { data: ..., meta: { requestId, timestamp } }
- Validate all request input with Zod before it touches a service
- Never commit .env files or hardcoded API keys
- All errors must go through the central error handler in middleware/error.ts

## What NOT to do — Claude must NEVER do these
- No ORM — use raw parameterized SQL only
- No SELECT * — always name columns explicitly
- Never push directly to main — always use feature branches
- Never inline SQL inside route handlers or services
- Never store passwords in plaintext — use bcrypt always
- Never skip tests when creating a new endpoint`)
)}

${h2("Step 3 — Verify Claude is reading and following your rules")}
${card("🧪","Canary test — confirm rules work before trusting them","Add a test rule, ask Claude to create a file, check it followed the rule","#0f766e",
  code(`# Step 1: Add a test rule to your CLAUDE.md:
## Rules
- Every new file Claude creates must have the comment
  "// CLAUDE_RULES_ACTIVE" on its very first line.

# Step 2: Launch Claude and ask it to create a new file:
claude
> "Create src/utils/dateFormatter.ts with a formatDate(date: Date) function
   that returns a YYYY-MM-DD string"

# Step 3: Check the created file:
head -1 src/utils/dateFormatter.ts
# Should print: // CLAUDE_RULES_ACTIVE
# If it does -> your rules are being read and followed

# Step 4: Remove the canary rule from CLAUDE.md once confirmed.

# Bonus — test that Claude pushes back on rule violations:
> "Use var instead of const for the date variable"
# Claude should refuse or explain why it uses const instead`)
)}

${h2("Step 4 — Set up nested CLAUDE.md for monorepos")}
${card("🗂️","One CLAUDE.md per package — all load simultaneously","Different rules for frontend vs backend — no conflict","#0f766e",
  code(`# Folder structure for a monorepo:
my-monorepo/
  CLAUDE.md                    <- root: org-wide rules, shared conventions
  packages/
    frontend/
      CLAUDE.md                <- React, Tailwind, component rules
    api/
      CLAUDE.md                <- Node.js, SQL, endpoint rules
    shared/
      CLAUDE.md                <- shared types, utilities

# Claude loads ALL relevant CLAUDE.md files simultaneously.
# More specific (deeper path) files win on conflicts.
# If root says "use camelCase" and packages/frontend says
# "use PascalCase for components" — both rules apply in frontend.

# Example root CLAUDE.md (organization-wide rules):
## Rules — all packages
- All commits must reference a GitHub issue: "feat(auth): ... #123"
- Never commit secrets or API keys to any package
- All packages must pass lint before committing

# Example packages/api/CLAUDE.md (API-specific rules):
## Rules — API package only
- All SQL in src/models/ — never elsewhere
- Parameterized queries only — never string interpolation in SQL`)
)}

${h2("Step 5 — Reference external files with @filename")}
${card("📎","Keep CLAUDE.md short by linking to detail docs","Use @filename to pull in schema, conventions, or any doc","#0f766e",
  code(`# In CLAUDE.md, reference other files with @:
## Database schema
@docs/database-schema.md

## API conventions
@docs/api-conventions.md

## Authentication rules
@docs/auth-design.md

# The @ path is RELATIVE to where the CLAUDE.md file is.
# If CLAUDE.md is in the project root:
#   @docs/schema.md  ->  ./docs/schema.md  (project root)
#
# If CLAUDE.md is in packages/api/:
#   @docs/schema.md  ->  ./packages/api/docs/schema.md
#
# Claude loads these files on demand when the topic is relevant.
# Recommended: keep CLAUDE.md under 200 lines.
# Move detail into referenced files — keep the main file scannable.

# Check what is in memory right now:
claude
/memory`)
)}

${box("tip","<b>💡 Best practice:</b> Commit CLAUDE.md to git. Every developer on your team gets the same Claude behavior automatically when they clone the repo.")}
`,

commands: ()=> `

# Rename a variable throughout one file:

# Edit is surgical — think of it as a targeted search-and-replace
# that Claude applies with full understanding of your code context.`)
)}
${card("📂","Glob/LS — find files by name or path pattern","Glob finds FILE NAMES — it does NOT look inside files. For file contents, use Grep.","#059669",
  code(`# Glob pattern examples:
  **/*.ts              -> all .ts files anywhere in the project
  **/*.test.ts         -> all test files anywhere
  src/routes/*.ts      -> .ts files directly in src/routes/ (not subdirs)
  src/**/*.ts          -> all .ts files anywhere under src/
  **/*.{ts,js}         -> all .ts and .js files anywhere

# Prompts that use Glob:

> "Find every source file in src/services/ that does NOT have a

> "Find every .env file in the project, including hidden ones.

# The critical distinction:
  "Find files NAMED auth.ts"               -> Glob (file name)
  "Find files that CONTAIN the word auth"  -> Grep (file content)`)
)}
${card("🔍","Grep — search inside file contents","Grep searches what is INSIDE files — text, patterns, function names, anything.","#059669",
  code(`# Find every usage of a function:
> "Find every place in the codebase that calls sendEmail().
   List the file path and line number for each occurrence."
  # Grep pattern: sendEmail(

# Find all TODO comments and prioritize them:
> "Search for all TODO, FIXME, HACK, and XXX comments.

  # Grep pattern: TODO|FIXME|HACK|XXX

# Find all places importing a specific module:
> "Find every file that imports from './database'.

  # Grep pattern: from ['"]./database['"]

# Find hardcoded values that should be constants:
> "Search all TypeScript files for any hardcoded port numbers

# GLOB vs GREP — remember this:
  "Find files NAMED userModel.ts"           -> Glob  (file NAME)
  "Find files that USE UserModel class"     -> Grep  (file CONTENT)
  "Find files in src/models/ folder"        -> Glob  (path)
  "Find files with SQL SELECT statements"   -> Grep  (content)

# Claude combines Glob + Grep automatically when needed:

${card("🌐","WebSearch — look up current information","Current docs, security CVEs, error solutions, changelog entries. Must be enabled in settings.json.","#059669",

{

# Search for breaking changes and apply them to your code:

# Search for security vulnerabilities in your dependencies:

${card("🤝","Task — spawn a subagent for isolated work","Delegates to a separate Claude instance. Only the final summary returns to your context — your context window stays clean.","#059669",
  code(`# WITHOUT Task — analyzing 300 files would fill your context:
> "Search all 300 files for deprecated API usage and list findings"
  # This floods your context with file contents — bad for long sessions

# WITH Task — only the final summary returns:
> "Use a subagent to search all files in src/ for deprecated API usage.

   error handling, and console.log in production code.
   Return only a clean list of file:line findings — nothing else."

# Run multiple subagents IN PARALLEL:

# When to use Task:
# - Searching many files (would flood your context)
# - Long-running analysis you want isolated
# - Work you want done in parallel across multiple areas
# Subagents are READ-ONLY by default — they report back, parent applies changes.`)
)}
${card("🗺️","Which tool for which job — quick lookup","When Claude gets the wrong tool, this helps you prompt more precisely","#059669",
  code(`YOUR TASK                                       WHICH TOOL
──────────────────────────────────────────────────────────────────────
Run npm test, git commit, curl, any shell cmd  -> Bash
Read and understand a specific file            -> Read  (use @filename)
Create a file that does not exist yet          -> Write
Change part of a file that already exists      -> Edit
Find files by name, extension, or folder path  -> Glob/LS
Find text or a pattern INSIDE files            -> Grep
Look up docs, CVEs, error solutions online     -> WebSearch
Delegate a large task without flooding context -> Task (subagent)

# Claude combines tools automatically — examples:
  "Fix the bug causing the crash in the error log"
  -> Bash (run app to reproduce) + Grep (find the relevant code)
  -> Edit (apply the fix) + Bash (run tests to confirm fixed)

  "Is this npm package vulnerable?"
  -> WebSearch (search for CVEs) + Read (check package.json)
  -> Grep (find usage in code) -> report findings`)
)}
`,

planmode: ()=> `
${p("Plan Mode makes Claude completely read-only — it can explore, read files, analyse, and propose plans, but it cannot write, edit, or delete any files. There are two distinct ways to use it and they serve different purposes.")}

${h2("Step 1 — Understand the two methods")}
${code(`Method 1: claude --permission-mode plan
  - Set at LAUNCH time, before the session starts
  - The ENTIRE session is read-only — no exceptions
  - Claude will refuse to edit files even if you ask
  - Use when: you know upfront you only want to explore

Method 2: /plan  (or press Shift+Tab twice)
  - Used INSIDE a session that is already running
  - Toggles plan mode ON or OFF
  - You can switch back and forth as many times as needed
  - Use when: you are working normally and want to pause to plan`)}

${card("⚠️","The difference — understand this before using either","They look similar but serve completely different situations","#b45309",
  `${code(`# --permission-mode plan:
# Launch Claude with this flag when your GOAL for the whole session
# is exploration, analysis, or planning — not making changes.
#
# Example session goal: "Understand this legacy codebase before touching it"
# Example session goal: "Audit our security before the pentest"
# Example session goal: "Plan the JWT migration before writing any code"
#
# The flag locks the whole session — no toggle, no override.


# /plan (toggle inside a session):
# You are mid-session, Claude has already done some work.
# You want to pause and think before the next step.
# Toggle plan mode on, get the plan, toggle back off, execute.
#
# Example: Fixed a bug, now want to plan what to tackle next
# Example: About to do a risky refactor, want a plan first`)}
  <div class="plan-grid">
    <div class="plan-box plan-box-blue">
      <div class="plan-box-label" style="color:#0369a1">--permission-mode plan (startup flag)</div>
      <div class="plan-box-desc">Entire session is read-only from message 1. No override. Use when your whole session goal is to explore/audit — not to make changes.</div>
    </div>
    <div class="plan-box plan-box-green">
      <div class="plan-box-label" style="color:#16a34a">/plan or Shift+Tab (mid-session toggle)</div>
      <div class="plan-box-desc">Switch on and off as many times as needed. Mix work and planning. Toggle back to normal when ready to execute the plan.</div>
    </div>
  </div>`
)}

${card("🔒","Method 1 — startup flag (whole session read-only)","Launch with --permission-mode plan when the entire session is exploration","#b45309",
  code(`# Step 1: Launch Claude with the flag:
claude --permission-mode plan

# Step 2: You are now in a fully read-only session.
# Claude can read any file, run read-only shell commands,
# and give you analysis — but it CANNOT write or edit files.

# Step 3: Ask for a deep codebase analysis:
> "Explore this codebase thoroughly and give me:
   1. An ASCII architecture diagram showing how the main modules connect
   2. The full data flow from an HTTP request to a database response
   3. A list of tech debt items with severity ratings (CRITICAL/HIGH/MEDIUM/LOW)
   4. A dependency map showing what each module depends on
   5. The safest order to make major changes without breaking things"

# Step 4: Ask for a security audit:
> "Conduct a security audit of the entire codebase. Check for:
   - SQL injection (any SQL not using parameterized queries)
   - Missing authentication on HTTP endpoints
   - Hardcoded secrets, API keys, or passwords in source code
   - CORS misconfigurations
   - Missing rate limiting on public endpoints
   - Unvalidated user input reaching the database
   Report each finding as CRITICAL / HIGH / MEDIUM / LOW
   with the exact file path and line number."

# Step 5: If you try to ask Claude to edit a file, it will refuse:
> "Fix the SQL injection in src/models/userModel.ts line 45"
# Claude responds: "I'm in plan mode — I can describe the fix but cannot
# apply it. Start a new session without --permission-mode plan to apply fixes."`)
)}

${card("🔄","Method 2 — toggle mid-session (/plan or Shift+Tab)","Switch in and out of plan mode while working — perfect for mixing work and planning","#b45309",
  code(`# Step 1: Start a normal session:
claude
# Claude starts normally — can read and write files

# Step 2: Do some normal work:
> "Fix the null pointer bug in src/auth.ts line 78"
# Claude reads the file, fixes the bug, writes the change

# Step 3: Before the next big step, toggle plan mode ON:
/plan
# OR press Shift+Tab twice
# Terminal shows: "Plan mode ON — Claude cannot edit files"

# Step 4: Now ask Claude to plan without risk of accidental changes:
> "What else needs to change to complete the JWT migration?
   List every file that will need updating, what specifically
   needs to change in each, and any compatibility risks to watch for."
# Claude gives you a full plan — reads files freely but touches nothing

# Step 5: Review the plan. When ready to execute, toggle back:
/plan
# OR press Shift+Tab twice again
# Terminal shows: "Plan mode OFF — normal mode resumed"

# Step 6: Execute just what you want:
> "Good. Execute phase 1 only: update the token validation in src/auth.ts
   and the session handling in src/middleware/session.ts"
# Claude makes the targeted changes you reviewed in the plan`)
)}

${card("🛡️","Use case — security audit (startup flag approach)","The safest way to audit: zero risk of accidental changes","#b45309",
  code(`# Step 1: Launch in read-only mode:
claude --permission-mode plan

# Step 2: Run a comprehensive security audit:
> "Conduct a full security audit of this codebase. Check each category below
   and for each finding include: file path, line number, severity, and
   exactly what the problem is and how to fix it.

   CATEGORY 1 — Injection:
   - SQL injection (look for string concatenation in SQL queries)
   - Command injection (shell commands with user input)
   - Path traversal (file paths built from user input)

   CATEGORY 2 — Authentication & authorization:
   - Endpoints missing authentication middleware
   - JWTs not verified or verified with weak config
   - Privilege escalation risks (user can access admin routes)

   CATEGORY 3 — Secrets:
   - Hardcoded API keys, passwords, or tokens in source code
   - Secrets in git-committed .env files
   - Secrets logged to console or files

   CATEGORY 4 — Input validation:
   - User input that reaches the database without validation
   - Missing type checking or schema validation
   - File uploads without type/size checking

   Output format:
   ## CRITICAL
   - [file:line] Description | Fix: ...

   ## HIGH
   - [file:line] Description | Fix: ..."

# Step 3: Save the report:
# Copy Claude's output, or use /export to save to a markdown file`)
)}

${card("📐","Use case — big refactor (toggle approach)","Plan before each step, execute when confident, repeat","#b45309",
  code(`# Start normally:
claude

# Get oriented:
> "Read src/auth.ts and understand the current token handling approach"

# Enable plan mode before planning the refactor:
/plan

# Get a safe, detailed plan:
> "We need to migrate from sessions to JWT tokens.
   Plan the complete migration:
   1. What files need changing and in what order?
   2. What tests will break and need updating?
   3. What is the rollback plan if something goes wrong?
   4. What should we do first to minimize risk?"

# Review the plan. Then toggle back to execute step 1:
/plan
> "Execute step 1 only: add the JWT library and create
   src/utils/jwt.ts with sign() and verify() helpers.
   Do not touch any existing auth code yet."

# Toggle plan on again to review step 2 before doing it:
/plan
> "Step 1 looks good. Review what step 2 would change and
   any risks before I approve it."

/plan  # toggle back
> "Looks safe. Execute step 2."`)
)}

${box("tip","<b>💡 Simple decision rule:</b> If your whole session goal is to understand or audit — use the startup flag. If you are working and want to pause to plan — use the toggle. When in doubt, use the toggle: it is more flexible.")}
`,

agents: ()=> `
${p("Almost everything in Claude Code is a plain markdown file. Agents are markdown files. Skills are markdown files. CLAUDE.md is a markdown file. Once you understand this, the whole system becomes simple: you just write instructions in markdown files and Claude follows them.")}

${h2("Step 1 — Understand the folder structure")}
${code(`# Create this structure in your project root:
mkdir -p .claude/agents .claude/skills .claude/hooks

# What goes where:
.claude/
  agents/
    code-reviewer.md     <- specialist agent   (MARKDOWN — you write this)
    db-analyst.md        <- specialist agent   (MARKDOWN — you write this)
  skills/
    deploy.md            <- reusable workflow  (MARKDOWN — you write this)
    pr-summary.md        <- reusable workflow  (MARKDOWN — you write this)
  hooks/
    guard-bash.sh        <- lifecycle scripts  (SHELL SCRIPT — exception)
  settings.json          <- permissions config (JSON — exception)
CLAUDE.md                <- project memory     (MARKDOWN — you write this)

# ONLY hooks and settings.json are not markdown.
# Everything else = markdown file = instructions Claude follows.`)}

${h2("Step 2 — Create your first agent")}
${code(`# Step 2a: Create the agent file:
touch .claude/agents/code-reviewer.md

# Step 2b: Open it and paste this template — then customize:
# ─────────────────────────────────────────────────────────
---
name: code-reviewer
description: Reviews code for bugs, security vulnerabilities, and convention
             violations. Auto-invoke whenever the user asks to review
             code changes, check a file, or look for issues.
tools: Read, Grep, Glob
model: sonnet
memory: project
---

You are a senior software engineer doing a thorough code review.

When reviewing code, always check in this order:
1. Security vulnerabilities (SQL injection, missing auth, exposed secrets)
2. Logic bugs and edge cases that could cause crashes or wrong results
3. Missing or incomplete error handling
4. Test coverage — flag any new code without tests
5. Convention violations (check CLAUDE.md rules)

Output format — use exactly this structure:
[CRITICAL] path/to/file.ts:45 — Description of the issue and how to fix it
[HIGH]     path/to/file.ts:12 — Description of the issue and how to fix it
[MEDIUM]   path/to/file.ts:8  — Description of the issue and how to fix it
[LOW]      path/to/file.ts:3  — Description of the issue and how to fix it

If no issues found in a category, omit that category.
End with a one-line summary: "X critical, Y high, Z medium, W low issues found."
# ─────────────────────────────────────────────────────────`)}

${h2("Step 3 — Understand every frontmatter field")}
${code(`---
name: code-reviewer
# REQUIRED. The identifier for this agent.
# Used when you explicitly invoke it:
# > "Use the code-reviewer agent to review src/auth.ts"
# Use lowercase with hyphens. No spaces.

description: Reviews code for bugs, security vulnerabilities, and convention
             violations. Auto-invoke whenever the user asks to review
             code changes, check a file, or look for issues.
# MOST IMPORTANT FIELD for automatic routing.
# Claude reads ALL agent descriptions at session start.
# When your prompt matches, Claude routes to this agent automatically.
# ALWAYS include: what it does + WHEN Claude should use it automatically.
# Be specific — vague descriptions cause poor routing.
# Bad:  "Reviews code"
# Good: "Reviews code for bugs and security issues. Auto-invoke when user
#        asks to review changes, check a file, or look for problems."

tools: Read, Grep, Glob
# Which built-in tools this agent can use.
# A reviewer with ONLY Read, Grep, Glob -> CANNOT edit any files -> safe.
# Full list of available tools:
#   Read, Write, Edit, Bash, Glob, Grep, WebSearch, Task
# Limit tools to what the agent actually needs — principle of least privilege.

model: sonnet
# Which Claude model runs this agent.
# opus   -> most capable, slowest, most expensive
#           Use for: complex reasoning, architecture, hard debugging
# sonnet -> balanced capability and cost (best default for most agents)
#           Use for: code review, writing, standard dev tasks
# haiku  -> fastest, cheapest, less capable
#           Use for: simple formatting, quick lookups, high-volume subtasks

memory: project
# Whether this agent remembers things across sessions.
# project -> remembers within this specific project only
# user    -> remembers across ALL your projects (global memory)
# (omit)  -> fresh start every single session — no memory
---`)}

${h2("Step 4 — How auto-invocation works")}
${code(`# When you launch Claude, it reads ALL agent descriptions in .claude/agents/.
# As you give prompts, Claude matches them to agent descriptions automatically.

# Example: You have three agents:
#   code-reviewer.md — "Reviews code for bugs and security..."
#   db-analyst.md    — "Analyses PostgreSQL performance and schema issues..."
#   test-writer.md   — "Writes unit and integration tests for new code..."

# Your prompt:
> "Review the changes I made to src/payments.ts"
# Claude reads: 'review' + 'changes' + '.ts file'
# Matches: code-reviewer description
# Routes to: code-reviewer agent automatically

> "Our API queries are slow — investigate the database"
# Claude reads: 'queries' + 'slow' + 'database'
# Matches: db-analyst description
# Routes to: db-analyst agent automatically

> "Write tests for the new checkout flow"
# Claude reads: 'write tests' + 'new code'
# Matches: test-writer description
# Routes to: test-writer agent automatically

# You can also always invoke explicitly:
> "Use the code-reviewer agent to review src/auth.ts"

# DO YOU NEED AGENTS? No — Claude can review code without an agent defined.
# Agents give you: consistent output format, right model, right tools,
# memory that builds up across sessions, and reliable auto-routing.`)}

${h2("Step 5 — Where Claude looks for agents")}
${code(`Priority order (highest to lowest):
1. Managed settings   <- Enterprise policy — overrides everything
2. --agents CLI flag  <- Session-only override
3. .claude/agents/    <- PROJECT agents — commit to git, shared with team
4. ~/.claude/agents/  <- PERSONAL agents — available in ALL your projects
5. Plugins            <- Installed via claude plugin install

# How to decide where to put an agent:
# Team uses it?     -> .claude/agents/    (commit to git)
# Only you use it?  -> ~/.claude/agents/  (your personal ~/.claude/)
# Try it once?      -> --agents flag      (session only, no files needed)

# Create a personal agent (available in all your projects):
mkdir -p ~/.claude/agents
touch ~/.claude/agents/my-agent.md`)}

${h2("Step 6 — Set up settings.json (permissions)")}
${card("🔐","Permissions — allow and deny lists","Pre-approve safe operations. Block dangerous ones. Claude asks for everything else.","#7c3aed",
  code(`# Create .claude/settings.json:
{
  "permissions": {
    "allow": [
      "Read",
      "Glob",
      "Grep",
      "Bash(npm test)",
      "Bash(npm run lint)",
      "Bash(npm run build)",
      "Bash(git diff *)",
      "Bash(git log *)",
      "Bash(git status)",
      "Write(src/*)",
      "Edit(src/*)",
      "Write(tests/*)",
      "Edit(tests/*)"
    ],
    "deny": [
      "Bash(rm -rf *)",
      "Bash(rm *)",
      "Bash(git push *)",
      "Bash(git reset --hard *)",
      "Bash(git force *)",
      "Write(.env*)",
      "Edit(.env*)",
      "Write(*.pem)",
      "Write(*.key)"
    ]
  }
}

# Rules:
# - "allow" list: Claude does these WITHOUT asking you each time
# - "deny" list:  Claude NEVER does these — blocked entirely
# - Anything not in either list: Claude asks you each time (safe default)
# - "deny" always wins if both allow and deny match the same operation`)
)}
${card("🗂️","Three settings files — what goes where","Personal defaults vs team rules vs your local machine","#7c3aed",
  code(`# FILE 1: ~/.claude/settings.json
# Your personal defaults — applies to ALL your projects
# Put: your preferred model, personal tool preferences
{
  "model": "claude-sonnet-4-6",
  "autoCompact": true
}

# FILE 2: .claude/settings.json  (COMMIT THIS TO GIT)
# Team-shared rules for this project — everyone gets them on clone
# Put: hooks, shared permissions, shared MCP servers, project model
{
  "permissions": {
    "allow": ["Read","Glob","Grep","Bash(npm test)"],
    "deny":  ["Bash(rm *)","Bash(git push *)","Write(.env*)"]
  },
  "hooks": { ... }
}

# FILE 3: .claude/settings.local.json  (ADD TO .gitignore)
# Your local machine overrides — never commit this
# Put: your personal API tokens, your local DB string, local paths
{
  "env": {
    "DATABASE_URL": "postgresql://me:pass@localhost:5433/mydb",
    "SLACK_BOT_TOKEN": "xoxb-your-personal-token"
  }
}

# Add to .gitignore:
echo '.claude/settings.local.json' >> .gitignore`)
)}
${card("📄","Complete settings.json example — realistic team config","Copy this, adjust the allow/deny lists to match your project","#7c3aed",
  code(`{
  "model": "claude-sonnet-4-6",
  "autoCompact": true,
  "permissions": {
    "allow": [
      "Read", "Glob", "Grep",
      "Bash(npm test)",
      "Bash(npm run test:*)",
      "Bash(npm run lint)",
      "Bash(npm run build)",
      "Bash(git diff *)",
      "Bash(git log *)",
      "Bash(git status)",
      "Bash(git add *)",
      "Bash(git commit *)",
      "Write(src/*)",
      "Edit(src/*)",
      "Write(tests/*)",
      "Edit(tests/*)"
    ],
    "deny": [
      "Bash(rm -rf *)",
      "Bash(rm *)",
      "Bash(git push *)",
      "Bash(git reset --hard *)",
      "Bash(git force-push *)",
      "Bash(DROP *)",
      "Write(.env*)",
      "Edit(.env*)",
      "Write(*.pem)",
      "Write(*.key)",
      "Write(*secret*)"
    ]
  },
  "hooks": {
    "PreToolUse": [{
      "matcher": "Bash",
      "hooks": [{"type":"command","command":".claude/hooks/guard-bash.sh"}]
    }],
    "PostToolUse": [{
      "matcher": "Write|Edit",
      "hooks": [{"type":"command","command":".claude/hooks/auto-lint.sh"}]
    }],
    "Stop": [{
      "hooks": [{"type":"command","command":".claude/hooks/run-tests.sh"}]
    }]
  }
}`)
)}
${box("tip","<b>💡 Don't write settings.json upfront.</b> Start working normally. Notice which operations make you nervous — 'I'd be unhappy if Claude did that without asking.' Then add those to the deny list. Build it from real experience over a week or two.")}
`,

skills: ()=> `
${p("Skills are markdown files that define reusable workflows. They work like custom slash commands — or Claude auto-invokes them when your prompt matches the description.")}
${box("info","<b>ℹ️ Skills vs CLAUDE.md:</b> CLAUDE.md always loads at session start — it is permanent project memory. Skills load on demand when the task matches.<br><b>Skills vs Hooks:</b> Skills fire when relevant and Claude decides it is appropriate. Hooks fire automatically on every matching lifecycle event with no exceptions.")}

${h2("Step 1 — Create the skills folder")}
${code(`# Skills live in .claude/skills/
# Each skill gets its own sub-folder with a SKILL.md inside:

mkdir -p .claude/skills/deploy
mkdir -p .claude/skills/new-endpoint
mkdir -p .claude/skills/explain-code

# Folder structure:
.claude/skills/
  deploy/
    SKILL.md        <- the skill definition
  new-endpoint/
    SKILL.md
  explain-code/
    SKILL.md`)}

${h2("Step 2 — Create a /deploy skill")}
${card("🚀","/deploy skill — step by step deployment checklist","Save this as .claude/skills/deploy/SKILL.md","#be185d",
  code(`# Step 1: Create the file:
touch .claude/skills/deploy/SKILL.md

# Step 2: Paste and customize this content:
# ─────────────────────────────────────────────────────────
---
name: deploy
description: Deploy to staging safely. Runs all quality checks before pushing.
             Use when the user asks to deploy, push to staging, or ship code.
---

When the /deploy command is used:

Step 1 — Check for uncommitted changes:
- Run: git status --porcelain

${card("🪝","SDK hooks — audit logging and security blocking","Add lifecycle callbacks in your own code — no shell scripts needed","#c026d3",
  code(`# Hooks in the SDK are async Python/TypeScript functions.
# They run at tool lifecycle events (PreToolUse, PostToolUse, etc).

import asyncio, json, datetime
from claude_agent_sdk import query, ClaudeAgentOptions

# Hook 1: Log every file write to an audit trail
async def audit_writes(hook_input, tool_use_id, context):
    if hook_input.tool_name in ('Write', 'Edit'):
        entry = {
            'tool':    hook_input.tool_name,
            'file':    hook_input.tool_input.get('path'),
            'session': context.session_id,
            'time':    datetime.datetime.utcnow().isoformat()
        }
        with open('audit.log', 'a') as f:
            f.write(json.dumps(entry) + '\\n')
        print(f'[AUDIT] {entry["tool"]} -> {entry["file"]}')
    return {'behavior': 'allow'}  # must return allow or deny

# Hook 2: Block dangerous bash commands
async def guard_bash(hook_input, tool_use_id, context):
    if hook_input.tool_name == 'Bash':
        cmd = hook_input.tool_input.get('command', '')
        dangerous = ['rm -rf', 'DROP TABLE', 'DROP DATABASE']
        for d in dangerous:
            if d.lower() in cmd.lower():
                print(f'[BLOCKED] Dangerous command: {cmd}')
                return {'behavior': 'deny', 'message': f'Command blocked: {d}'}
    return {'behavior': 'allow'}

# Register both hooks in the query call:
async def main():
    async for msg in query(
        prompt='Refactor src/users.ts to use the new error handler',
        options=ClaudeAgentOptions(
            allowed_tools=['Read', 'Write', 'Edit', 'Bash'],
            hooks={
                'PreToolUse': [audit_writes, guard_bash]
                # Both hooks run before every tool call
                # If guard_bash returns deny, audit_writes still ran first
            }
        )
    ):
        pass

asyncio.run(main())`)
)}

                               Best for: chat interfaces, live coding assistants

  code(`// Step 1: Install dependencies:
// npm install express @anthropic-ai/claude-agent-sdk

// Step 2: Create server.js:
const express = require('express');
const app = express();
app.use(express.json());

// Add CORS if your frontend is on a different port:
app.use((req, res, next) => {
  res.setHeader('Access-Control-Allow-Origin', '*');
  res.setHeader('Access-Control-Allow-Headers', 'Content-Type');
  next();
});

app.post('/api/agent/run', async (req, res) => {
  const { query, ClaudeAgentOptions } = await import('@anthropic-ai/claude-agent-sdk');
  const { prompt } = req.body;

  if (!prompt) {
    return res.status(400).json({ error: 'prompt is required' });
  }

  // Set SSE headers — browser receives these as a stream:
  res.setHeader('Content-Type', 'text/event-stream');
  res.setHeader('Cache-Control', 'no-cache');
  res.setHeader('Connection', 'keep-alive');
  res.flushHeaders();  // send headers immediately

  try {
    for await (const msg of query({
      prompt,
      options: new ClaudeAgentOptions({
        allowedTools: ['Read', 'Glob'],
        permissionMode: 'plan',  // read-only — safe for user-facing apps
      }),
    })) {

          .filter(b => b.type === 'text')
          .map(b => b.text)

          res.write('data: ' + JSON.stringify({ text }) + '\\n\\n');
        }

        res.write('data: ' + JSON.stringify({ done: true, result: msg.result }) + '\\n\\n');
      }

    res.write('data: ' + JSON.stringify({ error: err.message }) + '\\n\\n');

${card("🐍","FastAPI async streaming — complete working server","Python FastAPI version with full SSE setup","#16a34a",
  code(`# Step 1: Install dependencies:
# pip install fastapi uvicorn claude-agent-sdk

# Step 2: Create main.py:
from fastapi import FastAPI, HTTPException
from fastapi.responses import StreamingResponse
from fastapi.middleware.cors import CORSMiddleware
from pydantic import BaseModel
from claude_agent_sdk import query, ClaudeAgentOptions, AssistantMessage, ResultMessage
import json

app = FastAPI()

# Add CORS middleware for browser access:
app.add_middleware(
    CORSMiddleware,
    allow_origins=['*'],
    allow_methods=['*'],
    allow_headers=['*'],
)

class AgentRequest(BaseModel):
    prompt: str
    tools: list[str] = ['Read', 'Glob']

@app.post('/api/agent/run')
async def run_agent(req: AgentRequest):
    if not req.prompt:
        raise HTTPException(status_code=400, detail='prompt is required')

    async def stream_events():
        try:
            async for msg in query(
                prompt=req.prompt,
                options=ClaudeAgentOptions(allowed_tools=req.tools)
            ):
                if isinstance(msg, AssistantMessage):
                    for block in msg.message.content:
                        if block.type == 'text' and block.text:
                            yield 'data: ' + json.dumps({'text': block.text}) + '\\n\\n'
                elif isinstance(msg, ResultMessage):
                    yield 'data: ' + json.dumps({'done': True, 'result': msg.result}) + '\\n\\n'
        except Exception as e:
            yield 'data: ' + json.dumps({'error': str(e)}) + '\\n\\n'

    return StreamingResponse(
        stream_events(),
        media_type='text/event-stream',
        headers={'Cache-Control': 'no-cache', 'Connection': 'keep-alive'}
    )

# Step 3: Run the server:
# ANTHROPIC_API_KEY=sk-ant-... uvicorn main:app --reload

# Step 4: Test with curl:
# curl -X POST http://localhost:8000/api/agent/run \\
#   -H "Content-Type: application/json" \\
#   -d '{"prompt":"List all Python files in src/"}'`)

${h2("Pattern B — Job queue for long-running tasks")}
${card("📋","Job queue pattern — submit, get jobId, poll for results","For tasks that run for minutes or hours — browser does not wait","#16a34a",
  code(`// Step 1: Install dependencies:
// npm install express bullmq ioredis @anthropic-ai/claude-agent-sdk

// Step 2: Create job processor (worker.js):
const { Worker } = require('bullmq');
const Redis = require('ioredis');
const redis = new Redis();

// This function runs in the background for each queued job:
async function processAgentJob(job) {
  const { jobId, prompt, userId } = job.data;
  const { query, ClaudeAgentOptions } = await import('@anthropic-ai/claude-agent-sdk');

  // Mark job as running:
  await redis.hset('job:' + jobId, 'status', 'running');

  let result = '';
  try {
    for await (const msg of query({
      prompt,
      options: new ClaudeAgentOptions({
        allowedTools: ['Read', 'Write', 'Bash'],
      })
    })) {
      if (msg.type === 'assistant') {
        const text = msg.message.content
          .filter(b => b.type === 'text').map(b => b.text).join('');
        result += text;
        // Update partial result so client can show progress:
        await redis.hset('job:' + jobId, 'partialResult', result);
      }
      if (msg.type === 'result') {
        result = msg.result;
      }
    }
    // Mark job as done:
    await redis.hset('job:' + jobId, { status: 'done', result });
    // (Optional) send webhook or push notification to userId here
  } catch (err) {
    await redis.hset('job:' + jobId, { status: 'error', error: err.message });
  }
}

const worker = new Worker('agent-jobs', processAgentJob, { connection: redis });

// Step 3: Create submit endpoint (server.js):
const { Queue } = require('bullmq');
const queue = new Queue('agent-jobs', { connection: redis });

// Submit a job:
app.post('/api/agent/submit', async (req, res) => {

${h2("Pattern C — Per-user session manager")}
${card("👥","Per-user sessions — each user gets their own isolated Claude session","Users pick up exactly where they left off — session memory persists","#16a34a",
  code(`// Each user + project combination gets its own Claude session.
// Sessions are stored in Redis and resume automatically.

// Step 1: Install: npm install ioredis @anthropic-ai/claude-agent-sdk

class UserAgentManager {
  constructor(redisClient) {
    this.redis = redisClient;
  }

  // Get existing session ID for this user+project:
  async getSession(userId, projectId) {
    return this.redis.get('session:' + userId + ':' + projectId);
  }

  // Store new session ID (expires after 24 hours):
  async saveSession(userId, projectId, sessionId) {
    await this.redis.set(
      'session:' + userId + ':' + projectId,
      sessionId,
      'EX', 86400  // 24 hour TTL
    );
  }

  // Run an agent turn for this user, resuming their session if it exists:
  async *run(userId, projectId, prompt) {
    const { query, ClaudeAgentOptions } = await import('@anthropic-ai/claude-agent-sdk');
    const existingSessionId = await this.getSession(userId, projectId);

    for await (const msg of query({
      prompt,
      options: new ClaudeAgentOptions({
        allowedTools: ['Read', 'Glob'],
        // Resume the session if it exists — Claude remembers everything:
        resume: existingSessionId ?? undefined,
        // Each user works in their own isolated directory:
        cwd: '/workspaces/' + userId + '/' + projectId,
      })
    })) {
      // Save the new session ID from the init message:
      if (msg.type === 'system' && msg.subtype === 'init') {
        await this.saveSession(userId, projectId, msg.data.session_id);
      }
      yield msg;  // forward messages to the caller
    }
  }
}

// Step 2: Use in your Express endpoint:
const manager = new UserAgentManager(redis);

app.post('/api/agent/chat', async (req, res) => {
  const { prompt, projectId } = req.body;
  const userId = req.user.id;  // from your auth middleware

  res.setHeader('Content-Type', 'text/event-stream');
  res.setHeader('Cache-Control', 'no-cache');

  for await (const msg of manager.run(userId, projectId, prompt)) {
    if (msg.type === 'assistant') {
      const text = msg.message.content
        .filter(b => b.type === 'text').map(b => b.text).join('');
      if (text) res.write('data: ' + JSON.stringify({ text }) + '\\n\\n');
    }
  }
  res.end();
});`)
)}
`,

${h2("Step 3 — Rate limiting")}
${card("🚦","Rate limiting — max concurrent sessions + max per minute","Prevent one user from exhausting your API quota or compute","#b91c1c",
  code(`# Rate limiter with two controls:
# 1. Max concurrent sessions per user (prevents parallel abuse)
# 2. Max sessions per minute per user (prevents rapid-fire abuse)

from datetime import datetime, timedelta
from collections import defaultdict
import asyncio

class RateLimiter:
    MAX_CONCURRENT = 2    # max parallel sessions per user
    MAX_PER_MINUTE = 5    # max new sessions per user per minute

    def __init__(self):
        self.active = defaultdict(set)   # userId -> set of active session IDs
        self.times  = defaultdict(list)  # userId -> list of start times

    def can_start(self, user_id: str) -> tuple[bool, str]:
        # Check concurrent limit:
        if len(self.active[user_id]) >= self.MAX_CONCURRENT:
            return False, f'Max {self.MAX_CONCURRENT} concurrent sessions reached'

        # Check rate limit (count recent starts):
        now = datetime.utcnow()
        recent = [t for t in self.times[user_id]
                  if now - t < timedelta(minutes=1)]
        if len(recent) >= self.MAX_PER_MINUTE:
            return False, f'Rate limit: max {self.MAX_PER_MINUTE} sessions per minute'

        return True, ''

    def start(self, user_id: str, session_id: str):
        self.active[user_id].add(session_id)
        self.times[user_id].append(datetime.utcnow())

    def finish(self, user_id: str, session_id: str):
        self.active[user_id].discard(session_id)
        # Clean up old timestamps:
        now = datetime.utcnow()
        self.times[user_id] = [t for t in self.times[user_id]
                                if now - t < timedelta(minutes=1)]

# Step 2: Use in your endpoint:
limiter = RateLimiter()

async def run_agent_for_user(user_id: str, prompt: str):
    # Check rate limit first:
    ok, reason = limiter.can_start(user_id)
    if not ok:
        raise Exception(f'Rate limited: {reason}')

    session_id = str(uuid.uuid4())
    limiter.start(user_id, session_id)
    try:
        async for msg in query(prompt=prompt, ...):
            yield msg
    finally:
        limiter.finish(user_id, session_id)  # always clean up`)
)}

  code(`# Python — simple chat loop that keeps history:
import anthropic
from dotenv import load_dotenv
load_dotenv()

client = anthropic.Anthropic()
conversation_history = []  # you manage this list

print("Chat with Claude (type 'quit' to exit)\\n")

while True:
    # Get user input:
    user_input = input("You: ").strip()
    if user_input.lower() in ['quit', 'exit', 'q']:
        break
    if not user_input:
        continue

    # Add user message to history:
    conversation_history.append({
        "role": "user",
        "content": user_input
    })

    # Send FULL history to Claude every time:
    response = client.messages.create(
        model="claude-sonnet-4-6",
        max_tokens=1024,
        system="You are a helpful coding assistant.",
        messages=conversation_history  # the whole history, not just latest
    )

    # Extract Claude's reply:
    claude_reply = response.content[0].text

    # Add Claude's reply to history for next turn:
    conversation_history.append({
        "role": "assistant",
        "content": claude_reply
    })

    print(f"Claude: {claude_reply}\\n")

# After the loop: conversation_history contains the full chat.
# Save it to a file or database if you want to resume later.`)
)}

${h2("Step 14 — Handle errors properly")}
${code(`# The API can fail for several reasons. Always wrap calls in try/except.
# Python — full error handling:

import anthropic
from dotenv import load_dotenv
load_dotenv()

client = anthropic.Anthropic()

def call_claude(prompt: str, retries: int = 3) -> str:
    for attempt in range(retries):
        try:
            message = client.messages.create(
                model="claude-sonnet-4-6",
                max_tokens=1024,
                messages=[{"role": "user", "content": prompt}]
            )
            return message.content[0].text

        except anthropic.AuthenticationError:
            # Your API key is wrong or missing.
            print("ERROR: Invalid API key.")
            print("Check: is ANTHROPIC_API_KEY set in your .env file?")
            print("Check: is the key correct in console.anthropic.com/settings/keys?")
            raise  # do not retry — fixing the key requires manual action

        except anthropic.PermissionDeniedError:
            # Your account does not have access to this model or feature.
            print("ERROR: Permission denied.")
            print("Check: does your account have billing set up?")
            print("Check: is the model name correct?")
            raise

        except anthropic.RateLimitError:
            # Too many requests — slow down.
            import time
            wait = 2 ** attempt  # exponential backoff: 1s, 2s, 4s
            print(f"Rate limited. Waiting {wait}s before retry {attempt+1}/{retries}...")
            time.sleep(wait)

        except anthropic.APIStatusError as e:
            # Server-side error (500, 529 overload, etc.)
            if e.status_code == 529:
                import time
                wait = 5 * (attempt + 1)
                print(f"API overloaded. Waiting {wait}s before retry {attempt+1}/{retries}...")
                time.sleep(wait)
            elif e.status_code >= 500:
                import time
                print(f"Server error {e.status_code}. Retrying {attempt+1}/{retries}...")
                time.sleep(2)
            else:
                print(f"API error {e.status_code}: {e.message}")
                raise

        except anthropic.APIConnectionError:
            # Network problem — no internet, DNS failure, firewall, etc.
            import time
            print(f"Connection error. Check your internet. Retrying {attempt+1}/{retries}...")
            time.sleep(2)

    raise RuntimeError(f"All {retries} retries failed")

# Use it:
result = call_claude("What is 2 + 2?")
print(result)`)}

function buildNav(){
  const inner = document.getElementById("nav-inner");
  inner.innerHTML = SECTIONS.map(s=>{
    const isProd = PROD.has(s.id);
    return `<button
      class="nav-btn${isProd?" prod":""}${s.id===active?" active":""}"
      style="--c:${s.color}"
      onclick="setSection('${s.id}')"
    >${s.label}</button>`;
  }).join("");
}

function buildContent(){
  const sec = SECTIONS.find(s=>s.id===active);
  const isProd = PROD.has(active);
  document.getElementById("content").innerHTML = `
    <div class="section-header" style="background:${sec.bg};--c:${sec.color}">
      <h2 style="color:${sec.color}">${sec.title}</h2>
      ${isProd?'<div class="section-tag">● Production Integration</div>':""}
    </div>
    ${CONTENT[active]()}
  `;
}

function setSection(id){
  active=id;
  buildNav();
  buildContent();
  window.scrollTo({top:0,behavior:"smooth"});
}

buildContent();
